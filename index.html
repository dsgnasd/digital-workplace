<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровое рабочее место</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F7; --surface:#FFFFFF; --surface-2:#F5F8FB; --line:#D6DEE8; --line-strong:#B8C4D3;
  --ink:#0F1B2D; --ink-2:#34445A; --muted:#556479; --faint:#5F6E83; --field:#8796AA;
  --accent:#1F4FBF; --accent-2:#3B6FE0; --accent-soft:#E3EDFC;
  --ok:#136C37; --ok-soft:#E3F4E8;
  --red:#B4372B; --red-soft:#F7E4E1; --amber:#86560C; --amber-soft:#F6EBD6; --blue:#0369A1; --blue-soft:#E0F2FE;
  --side:#0F1B2D; --side-ink:#C9D5E6; --side-mute:#8796AE; --side-on:#1C2B44;
  --doc:#F8FAFD; --doc-line:#CAD5E3;
  --r-s:4px; --r-m:8px; --r-l:14px;
  --display:"Unbounded",system-ui,sans-serif; --ui:"Onest",system-ui,-apple-system,sans-serif; --code:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1220; --surface:#111A2B; --surface-2:#162236; --line:#22314A; --line-strong:#304260;
    --ink:#E4EAF3; --ink-2:#C0CBDB; --muted:#93A1B5; --faint:#8090A6; --field:#5A6F8F;
    --accent:#7AA7FF; --accent-2:#A3C3FF; --accent-soft:#16264A;
    --ok:#4ADE80; --ok-soft:#10301E;
    --red:#F08A7C; --red-soft:#3A1E1A; --amber:#E2AE55; --amber-soft:#33270F; --blue:#7DD3FC; --blue-soft:#0E2A3D;
    --side:#070D18; --side-ink:#C9D5E6; --side-mute:#8796AE; --side-on:#162236;
    --doc:#121D30; --doc-line:#2A3B57;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1220; --surface:#111A2B; --surface-2:#162236; --line:#22314A; --line-strong:#304260;
    --ink:#E4EAF3; --ink-2:#C0CBDB; --muted:#93A1B5; --faint:#8090A6; --field:#5A6F8F;
    --accent:#7AA7FF; --accent-2:#A3C3FF; --accent-soft:#16264A;
    --ok:#4ADE80; --ok-soft:#10301E;
    --red:#F08A7C; --red-soft:#3A1E1A; --amber:#E2AE55; --amber-soft:#33270F; --blue:#7DD3FC; --blue-soft:#0E2A3D;
    --side:#070D18; --side-ink:#C9D5E6; --side-mute:#8796AE; --side-on:#162236;
    --doc:#121D30; --doc-line:#2A3B57;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--code);font-size:13px;letter-spacing:0}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.2}

/* --- каркас --- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:2px 10px 26px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font:700 10px/1 var(--display);letter-spacing:.02em;color:#fff;flex:none}
:root[data-theme="dark"] .brand .logo{background:var(--accent-2);color:var(--side)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo{background:var(--accent-2);color:var(--side)}}
.brand b{font:600 14px/1 var(--display);letter-spacing:-.01em;color:#fff;white-space:nowrap}
:root[data-theme="dark"] .brand b{color:var(--side-ink)}
.nav-label{font-size:12.5px;color:var(--side-mute);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-m);cursor:pointer;color:var(--side-ink);border:0;background:none;text-align:left;width:100%;font-size:14.5px}
.nav span:first-child{width:18px;text-align:center;opacity:.6}
.nav:hover{background:var(--side-on)}
.nav.on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 var(--accent-2)}
.nav.on span:first-child{opacity:1}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:var(--r-s);font-size:12px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--side-mute);padding:10px;line-height:1.5}
.side-foot .btn{background:transparent;border-color:var(--side-on);color:var(--side-ink);margin-top:12px}
.side-foot .btn:hover{background:var(--side-on)}
main{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 36px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.topbar h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.content{padding:28px 36px 72px;max-width:1240px}

/* --- поля --- */
select,input[type=text],input[type=search],input[type=date],input[type=email],textarea{background:var(--surface);border:1px solid var(--field);border-radius:var(--r-m);padding:9px 12px;min-width:0;min-height:40px;transition:border-color .12s}
select{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;color:var(--ink-2);font-weight:500}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field select{width:100%}

/* --- кнопки --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-m);padding:8px 16px;min-height:40px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok:hover{background:var(--accent-2)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.ok{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.ok{color:#0B1220}}

/* --- поверхности --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font:600 15px/1.3 var(--ui);letter-spacing:0}
.card-b{padding:18px 20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* приветствие + полоса показателей */
.hello h2{font-size:26px;margin:0 0 8px;max-width:34ch}
.hello p{margin:0;color:var(--muted);max-width:62ch}
.statline{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.statline>div{padding:16px 18px 14px;border-left:1px solid var(--line)}
.statline>div:first-child{border-left:0;padding-left:0}
.statline .v{font:600 34px/1 var(--display);letter-spacing:-.02em}
.statline .l{color:var(--muted);font-size:13.5px;margin-top:8px}
.statline .v.alert{color:var(--red)}

/* таблицы */
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.click:hover td:first-child b{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}

/* бейджи: квадратные метки с точкой */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-s);padding:2px 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-grey{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--amber-soft);color:var(--amber)}
.b-bad{background:var(--red-soft);color:var(--red)}
.b-info{background:var(--blue-soft);color:var(--blue)}
.b-vio{background:var(--accent-soft);color:var(--accent)}
.b-ready{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.b-ok{background:var(--ok);color:#fff}
:root[data-theme="dark"] .b-ok{color:#0B1220}
:root[data-theme="dark"] .nav .cnt,:root[data-theme="dark"] .bell-n{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .cnt,:root:not([data-theme="light"]) .bell-n{color:#0B1220}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-ok{color:#0B1220}}

/* чипы инструментов */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:4px 10px;font-size:13px;margin:0 6px 6px 0;background:var(--surface);line-height:1.35}
.chip.click{cursor:pointer;transition:border-color .12s,background .12s}.chip.click:hover{border-color:var(--accent)}
.chip.req{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .chip.req{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.req{color:#0B1220}}
.chip.opt{border-style:dashed;border-color:var(--accent-2);color:var(--accent)}
.chip.off{color:var(--faint);border-color:var(--line)}
.chip a{color:inherit;text-decoration:none;opacity:.6}.chip a:hover{opacity:1}

.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:22px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}

.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}

.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--field);border-radius:var(--r-m);cursor:pointer;background:var(--surface)}
.check:hover{border-color:var(--accent)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.check.on{border-color:var(--accent);background:var(--accent-soft)}

/* шаги мастера — реальная последовательность */
.steps{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:24px;counter-reset:s}
.step{position:relative;padding:12px 12px 0 0;font-size:13.5px;color:var(--muted);cursor:pointer;border-top:3px solid var(--line)}
.step b{display:block;font:600 12px var(--display);color:var(--muted);margin-bottom:2px}
.step.on{border-top-color:var(--accent);color:var(--ink);font-weight:600}
.step.on b{color:var(--accent)}
.step.done{border-top-color:var(--accent-2);color:var(--ink-2)}
.step.done b{color:var(--accent-2)}
.step+.step{margin-left:6px}

.model-card{padding:16px;border:1px solid var(--line-strong);border-radius:var(--r-m);cursor:pointer;background:var(--surface);position:relative}
.model-card:hover{border-color:var(--accent)}
.model-card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.model-card.on:after{content:"✓";position:absolute;top:12px;right:14px;color:var(--accent);font-weight:700}
.model-card b{display:block;margin-bottom:6px;font-size:14.5px}

.member{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--display);background:var(--accent-soft);color:var(--accent);flex:none}

/* шкала статусов */
.timeline{display:flex;margin:4px 0 0}
.tl{flex:1;position:relative;font-size:12.5px;color:var(--faint);padding-top:18px}
.tl:before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--doc-line)}
.tl:after{content:"";position:absolute;top:1px;left:0;width:10px;height:10px;border-radius:50%;background:var(--doc);border:2px solid var(--doc-line)}
.tl.done{color:var(--ink-2)}.tl.done:before{background:var(--accent)}.tl.done:after{background:var(--accent);border-color:var(--accent)}
.tl.cur{color:var(--ink);font-weight:600}.tl.cur:after{border-color:var(--accent);background:var(--doc);box-shadow:0 0 0 3px var(--accent-soft)}

/* схема-поток */
.flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:0}
.flow .node{flex:1;min-width:150px;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.flow .node b{display:block;font-size:14px;margin-bottom:4px;color:var(--ink)}
.flow .arr{display:grid;place-items:center;color:var(--line-strong);padding:0 4px;font-size:16px}

.kv{display:grid;grid-template-columns:190px 1fr;gap:10px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-m);font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(15,27,45,.25);transition:opacity .3s}
.callout{border-left:3px solid var(--line-strong);background:var(--surface-2);padding:12px 16px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px;color:var(--ink-2);max-width:88ch}
.callout.warn{border-color:var(--amber);background:var(--amber-soft)}
.matrix td,.matrix th{padding:9px 10px;text-align:center;font-size:13px}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.st{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--r-s);font-size:12px;font-weight:700;line-height:0;vertical-align:middle;flex:none}
.st svg.lucide{display:block;vertical-align:0}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.wip{background:var(--amber-soft);color:var(--amber)}.st.new{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.st.plan{background:transparent;color:var(--faint);box-shadow:none;outline:1px dashed var(--line-strong);outline-offset:-1px}
.menu-toggle{display:none}

/* --- UX-правки: ссылки-кнопки, ошибки, подсказки, поиск, печать --- */
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-m);border:1px solid var(--line-strong)}
.skip:focus{left:8px}
.content:focus{outline:none}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px;text-align:left}
.linkbtn:hover{text-decoration-color:currentColor}
.linkbtn.pname{color:var(--ink);font-weight:600;text-decoration:none}
tr.click:hover .linkbtn.pname,.linkbtn.pname:hover{text-decoration:underline}
button.step{appearance:none;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:var(--muted)}
button.step.on{color:var(--ink)}
button.model-card{font:inherit;text-align:left;color:inherit;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
button.chip{font:inherit;font-size:13px;cursor:pointer}
.m-only{display:none}
@media (max-width:960px){.m-only{display:inline}}
.chip-x{border:0;background:none;padding:0 0 0 2px;margin-left:2px;color:var(--muted);cursor:pointer;display:inline-flex}
.chip-x:hover{color:var(--red)}
.chip-x svg.lucide{width:14px;height:14px}
.req-mark{color:var(--red)}
.stack>.req-note{margin-bottom:0}
.flabel{font-size:13.5px;color:var(--ink-2);font-weight:500}
.ferr{font-size:12.5px;color:var(--red);font-weight:500}
.ferr:empty{display:none}
input[aria-invalid="true"],textarea[aria-invalid="true"],.dd-btn[aria-invalid="true"]{border-color:var(--red)!important;box-shadow:0 0 0 3px var(--red-soft)}
.wiz-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-8px 0 14px}
.wiz-top svg.lucide{width:15px;height:15px}
.wiz-top .linkbtn{margin-left:auto;font-size:13px}
.tip{border:0;background:none;padding:4px;margin:-4px -4px -4px 1px;min-width:24px;min-height:24px;align-items:center;justify-content:center;color:var(--muted);cursor:help;position:relative;display:inline-flex;vertical-align:-3px}
.tip svg.lucide{width:15px;height:15px}
.tip:hover,.tip:focus-visible{color:var(--accent)}
.tip-pop{position:fixed;z-index:120;max-width:280px;background:var(--ink);color:var(--paper);font:400 12.5px/1.45 var(--ui);padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(15,27,45,.25);pointer-events:none}
.shint{font-size:12.5px;color:var(--muted);margin-top:2px}
.shint.late{color:var(--red);font-weight:500}
.shint.ok{color:var(--ok);font-weight:500}
.ptools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:220px}
.search svg.lucide{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;pointer-events:none}
.search input{width:100%;padding-left:34px}
ul.plain{margin:0;padding-left:20px;display:grid;gap:8px;max-width:80ch}
#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:90;align-items:flex-end}
#toasts .toast{position:static;display:flex;align-items:center;gap:14px}
.toast-undo{border:0;background:none;color:inherit;font:600 14px var(--ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.dp-day.off{color:var(--line-strong);cursor:not-allowed;text-decoration:line-through}
.dp-day.off:hover{background:none}
@media print{
  aside,.topbar,.skip,.passport-actions,.tabs,#toasts,.callout,.wiz-top{display:none!important}
  .app{display:block}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .stamp{animation:none!important}
  .card,.passport{break-inside:avoid}
}

/* --- практики: готовность, пересмотр, SLA, внимание --- */
.ready-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--amber);margin-top:8px}
.ready-line.ok{color:var(--ok)}
.ready-line svg.lucide{width:15px;height:15px}
.team-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.team-bar>div:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.team-bar>div:first-child>.small{grid-column:2}
.team-bar>div:first-child>svg.lucide{color:var(--accent)}
.trow .ts{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.sla{font-size:12px;color:var(--muted);white-space:nowrap}
.sla.warn{color:var(--amber);font-weight:500}
.sla.late{color:var(--red);font-weight:600}
.op-revoke{color:var(--red);font-weight:500}
.attn{list-style:none;margin:0;padding:6px 0}
.attn li{display:flex;align-items:center;gap:12px;padding:10px 20px}
.attn li+li{border-top:1px solid var(--line)}
.attn li>span{flex:1}
.attn li svg.lucide{color:var(--muted)}
.attn li.late svg.lucide{color:var(--red)}
.attn li.late>span{color:var(--ink);font-weight:500}
.checklist{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;margin-bottom:18px;background:var(--surface-2)}
.cl-h{display:flex;justify-content:space-between;align-items:baseline}
.cl-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.cl-item>span{flex:1}
.cl-item svg.lucide{color:var(--faint)}
.cl-item.ok svg.lucide{color:var(--ok)}
.cl-item.ok>span{color:var(--muted)}
.modal .m-b{max-height:62vh;overflow:auto}
.modal .m-b select{width:100%}
fieldset.rv{border:1px solid var(--line);border-radius:var(--r-m);margin:0 0 10px;padding:8px 14px 10px}
fieldset.rv legend{padding:0 6px;font-weight:600;font-size:14px}
.rv-i{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;cursor:pointer}
.rv-i input{accent-color:var(--accent);width:16px;height:16px}

/* --- вход --- */
.user-chip{display:flex;align-items:center;gap:8px;flex:none;height:38px;padding:0 0 0 4px;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.uc-ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.uc-ic svg.lucide{width:16px;height:16px}
.uc-name{font-size:14px;font-weight:500;white-space:nowrap;padding-right:4px}
.uc-out{align-self:stretch;width:38px;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.uc-out:hover{color:var(--red);background:var(--red-soft)}
.uc-out svg.lucide{width:16px;height:16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.login-side{background:var(--side);color:var(--side-ink);padding:36px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-side .brand{padding:0}
.login-side h1{font-size:34px;line-height:1.15;color:#fff;margin:0 0 16px;max-width:16ch}
:root[data-theme="dark"] .login-side h1{color:var(--side-ink)}
.login-side p{color:var(--side-mute);max-width:46ch;margin:0}
.login-main{display:grid;place-items:center;padding:40px 24px}
.login-main:focus{outline:none}
.login-card{width:min(560px,100%)}
.login-card h2{font-size:24px;margin:0 0 6px}
.login-card>p.muted{margin:0 0 20px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:inherit;padding:14px 16px;border:1px solid var(--field);border-radius:var(--r-m);background:var(--surface);cursor:pointer;position:relative}
.role-card{transition:border-color .12s,box-shadow .12s,background .12s}
.role-card:hover,.role-card:focus-visible{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.role-card:focus-visible{outline-offset:3px}
.rc-go{position:absolute;top:16px;right:16px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s}
.role-card:hover .rc-go,.role-card:focus-visible .rc-go{opacity:1;transform:none}
.rc-last{position:absolute;top:16px;right:16px;font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:1px 7px}
.role-card:hover .rc-last,.role-card:focus-visible .rc-last{opacity:0}
.role-card b{font-size:15px}
.rc-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);margin-bottom:4px}
.role-card:hover .rc-ic,.role-card:focus-visible .rc-ic{background:var(--surface)}
@media (max-width:960px){
  .login{grid-template-columns:1fr}
  .login-side{padding:24px 16px;gap:16px}
  .login-side h1{font-size:24px}
  .login-side>p.small{display:none}
  .role-grid{grid-template-columns:1fr}
  .uc-name{display:none}
  .passport h2{font-size:22px;max-width:none}
  .passport .timeline{overflow-x:auto;scrollbar-width:none}
  .passport .tl{min-width:68px;font-size:11.5px}
  .row>details.demo{flex:1 1 100%}
  .demo .demo-b .btn{white-space:normal;text-align:left}
  .callout.row{flex-direction:column;align-items:flex-start}
  .callout.row .btn{width:100%}
}

/* --- поиск в списках --- */
.dd-search{position:sticky;top:-4px;margin:-4px -4px 4px;padding:8px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}
.dd-search svg.lucide{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.dd-search input{width:100%;min-height:36px;padding-left:32px}
.dd-empty{padding:12px;color:var(--muted);font-size:14px}
.dd-opt[hidden]{display:none}

/* --- коды проектов --- */
.codes{display:flex;flex-wrap:wrap;gap:4px}
.code-link{font:500 12.5px/1.6 var(--code);padding:1px 8px;border-radius:var(--r-s);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);cursor:pointer}
.code-link:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* --- рекомендации теста: сотрудник, запросы, документы --- */
.my-pm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-bottom:14px}
.my-pm>svg.lucide{color:var(--muted)}
.my-pm>span{flex:1}
.rq-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.doc-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;font-size:14px;line-height:1.55;margin:0}
ol.doc-box.rules{padding-left:32px;display:grid;gap:6px}

/* --- уведомления --- */
.bell-wrap{position:relative;flex:none}
.bell{width:38px;height:38px;border:1px solid var(--line-strong);border-radius:var(--r-m);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;position:relative}
.bell:hover{border-color:var(--muted)}
.bell[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bell svg.lucide{width:18px;height:18px}
.bell-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:600 11px/18px var(--ui);text-align:center;border:2px solid var(--paper)}
.notif-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-m);box-shadow:0 14px 36px rgba(15,27,45,.18);z-index:70;overflow:hidden}
.np-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.np-list{max-height:min(420px,70vh);overflow:auto}
.np-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;font:inherit;color:var(--ink-2);cursor:pointer}
.np-item:hover,.np-item:focus-visible{background:var(--surface-2)}
.np-item>svg.lucide{width:16px;height:16px;color:var(--muted);margin-top:3px;flex:none}
.np-item.unread{color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.np-item.unread>svg.lucide{color:var(--accent)}
.np-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.np-t{font-size:14px;line-height:1.4}
.np-item.unread .np-t{font-weight:500}
.np-d{font-size:12px;color:var(--muted)}
.np-empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:14px}
/* --- вопрос по заявке --- */
.tq{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:8px 10px;border-radius:var(--r-s);background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.tq svg.lucide{width:15px;height:15px;color:var(--muted);flex:none;margin-top:2px}
.trow .ta{gap:6px}
.q-btn{padding:0;width:32px}
/* --- шаблоны: применение к проектам --- */
.tpl-diff{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--amber-soft);color:var(--ink-2);font-size:13.5px;border-bottom:1px solid var(--line)}
.tpl-diff>svg.lucide{color:var(--amber);width:16px;height:16px}
.tpl-diff>span{flex:1;min-width:220px}

/* --- «Как это работает»: сетка шагов --- */
.flow.steps-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.flow.steps-grid .arr{display:none}
.flow.steps-grid .node{min-width:0;text-align:left}
.flow.steps-grid .node b{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:6px}
.flow.steps-grid .node b svg.lucide{width:20px;height:20px}
@media (max-width:1100px){.flow.steps-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.flow.steps-grid{grid-template-columns:1fr}}

/* --- раунд 3: исполнитель, меню «Ещё» --- */
.tassign{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--ink-2);font-size:12.5px}
.tassign svg.lucide{width:13px;height:13px;color:var(--muted)}
details.more{display:none;position:relative}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
.more-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-m);box-shadow:0 14px 36px rgba(15,27,45,.16);padding:4px;z-index:30}
.more-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r-s);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.more-i:hover{background:var(--surface-2)}
@media (max-width:960px){ .d-only{display:none!important} details.more{display:block} .passport-actions{justify-content:flex-start} .more-pop{left:0;right:auto} }

/* --- версии шаблонов --- */
details.vers{border-top:1px solid var(--line)}
details.vers>summary{padding:12px 20px;font-size:14px}
.vlist{list-style:none;margin:0;padding:6px 20px 14px;display:grid;gap:8px}
.vlist li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;font-size:14px}
/* --- отчёт по ИИ: одна серия, один оттенок, неброские оси --- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-grid-f{fill:var(--line)}
.ch-base{stroke:var(--line-strong);stroke-width:1}
.ch-ax{fill:var(--muted);font:12px var(--ui)}
.ch-val{fill:var(--ink);font:600 12px var(--ui)}
.ch-fill{fill:var(--accent)}
.ch-hit{fill:transparent}
.ch-bar:hover .ch-fill,.ch-bar:focus .ch-fill{fill:var(--accent-2)}
.ch-bar:focus{outline:none}
.ch-bar:focus .ch-hit{stroke:var(--accent);stroke-width:2}
.spark{display:block}
.num{font-variant-numeric:tabular-nums}
.blk{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600}
.blk svg.lucide{width:14px;height:14px;color:var(--red)}
.hbar{margin-bottom:12px}
.hbar-l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.hbar-t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hbar-t i{display:block;height:100%;background:var(--ink-2);border-radius:0 4px 4px 0}
.ai-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:960px){.ai-grid{grid-template-columns:1fr}}

/* --- календарь --- */
.dd-val.ph{color:var(--faint)}
.dp-ic{width:16px;height:16px;color:var(--muted);flex:none}
.dp-btn[aria-expanded="true"] .dp-ic{color:var(--accent)}
.dd-pop.dp-pop{width:300px;padding:12px;max-height:none;overflow:visible}
.dp-h{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.dp-h b{flex:1;font:600 15px/1 var(--ui);padding-left:6px}
.dp-nav{width:34px;height:34px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.dp-nav:hover{background:var(--surface-2);color:var(--ink)}
.dp-nav svg{width:18px;height:18px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-wd{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 4px}
.dp-day{height:36px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.dp-day:hover{background:var(--surface-2)}
.dp-day.out{color:var(--faint)}
.dp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.dp-day.sel{background:var(--accent);color:#fff;font-weight:600;box-shadow:none}
:root[data-theme="dark"] .dp-day.sel{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dp-day.sel{color:#0B1220}}
.dp-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dp-f{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dp-link{border:0;background:none;color:var(--accent);font-weight:500;cursor:pointer;padding:6px 10px;border-radius:6px}
.dp-link:hover{background:var(--accent-soft)}

/* --- переключатель темы --- */
.theme-sw{display:inline-flex;gap:2px;border:1px solid var(--line-strong);border-radius:var(--r-m);padding:2px;background:var(--surface)}
.theme-sw button{border:0;background:none;width:32px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.theme-sw button:hover{color:var(--ink);background:var(--surface-2)}
.theme-sw button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent)}
.theme-sw svg.lucide{width:16px;height:16px}
aside .theme-sw{background:transparent;border-color:var(--side-on)}
aside .theme-sw button{color:var(--side-mute)}
aside .theme-sw button:hover{color:var(--side-ink);background:var(--side-on)}
aside .theme-sw button[aria-checked="true"]{background:var(--side-on);color:var(--accent-2)}
/* низ сайдбара: тема + сброс, в сетке меню */
aside .side-foot{margin-top:auto;padding:14px 0 0;border-top:1px solid var(--side-on);display:grid;gap:8px;font-size:14px}
aside .sf-label{font-size:12.5px;color:var(--side-mute);padding:0 10px}
aside .theme-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border:0;border-radius:var(--r-m);background:rgba(255,255,255,.045)}
aside .theme-sw button{width:auto;height:32px;border-radius:6px}
aside .theme-sw button[aria-checked="true"]{background:var(--side-on);color:var(--accent-2);box-shadow:0 1px 2px rgba(0,0,0,.25)}
aside .side-reset{color:var(--side-mute);margin-top:2px}
aside .side-reset:hover{color:var(--side-ink)}

/* --- хлебные крошки --- */
.crumb{border:0;background:none;padding:0;font:inherit;color:var(--muted);cursor:pointer}
.crumb:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.crumb-sep{color:var(--line-strong);margin:0 10px;font-weight:400}

/* --- раскрывающиеся блоки --- */
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 20px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.fold[open]>summary:after{transform:rotate(-135deg)}
details.fold>summary svg.lucide{color:var(--accent)}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
.demo{border:1px dashed var(--line-strong);border-radius:var(--r-m);background:transparent}
.demo>summary{padding:10px 14px;font-weight:500;color:var(--muted);font-size:14px}
.demo .demo-b{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
aside .demo{border-color:var(--side-on);margin-top:10px}
aside .demo>summary{color:var(--side-mute)}
aside .demo>summary:after{border-color:var(--side-mute)}
aside .demo .demo-b{color:var(--side-mute);flex-direction:column;align-items:flex-start}

/* --- сервис-деск: группы и строки --- */
.tgroup+.tgroup{border-top:1px solid var(--line)}
.tg-h{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface-2)}
.tg-h .who{min-width:0}.tg-h .who b{display:block;font-size:14.5px}.tg-h .who span{font-size:13px;color:var(--muted)}
.tg-h .cnt-open{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.trow{display:grid;grid-template-columns:72px minmax(0,1fr) 190px 140px 210px;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.trow .tid{font-family:var(--code);font-size:13px;color:var(--muted);white-space:nowrap}
.trow .tt{min-width:0}
.trow .tg{font-size:13px;color:var(--muted)}
.trow .ta{display:flex;justify-content:flex-end;white-space:nowrap}
.trow .sla{white-space:nowrap}
.trow.done .tt{color:var(--muted)}
.dproj-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.dproj-h h3{margin:0;font:600 16px/1.3 var(--ui)}
.dproj-h .progress{width:140px}

/* --- модальное окно --- */
.modal-bg{position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-l);width:min(480px,100%);box-shadow:0 24px 64px rgba(15,27,45,.3);border:1px solid var(--line)}
.modal h2{font-size:18px;margin:0;padding:20px 22px 6px}
.modal .m-b{padding:6px 22px 18px;color:var(--ink-2)}
.modal .m-b p{margin:0 0 12px}
.modal .m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-reduced-motion: no-preference){.modal{animation:mIn .16s ease-out}@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}

.approve-sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.approve-sum b{font-weight:600;color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-left:auto}
.legend>span{display:inline-flex;align-items:center;gap:8px}

/* ===== Паспорт проекта — главный элемент ===== */
.passport{position:relative;background:var(--doc);border:1px solid var(--doc-line);border-radius:var(--r-l);overflow:hidden;
  background-image:repeating-linear-gradient(135deg,transparent 0 22px,color-mix(in srgb,var(--accent) 4%,transparent) 22px 23px);}
.passport-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--doc-line);font-size:13px;color:var(--muted)}
.passport-top .emblem{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:600}

function genGrant(s, p, m, join=true){

// Готовность сотрудника к первому рабочему дню на проекте
function readiness(p, emp){
  const m=p.team.find(x=>x.emp===emp); if(!m) return null;
  const legacy=['active','closing','closed'].includes(p.status);
  const tk=S.tickets.filter(t=>t.pid===p.id&&t.kind==='access'&&t.emp===emp);
  const ch=S.tickets.filter(t=>t.pid===p.id&&(t.kind==='channel'||(t.kind==='join'&&t.title.includes(E(emp).name))));
  const a=(p.acks||{})[emp]||{};
  const needSec=CLIENT_MODELS[p.model].dlp||p.clientInComms;
  const items=[
    {k:'access', t:'Доступы к инструментам выданы', ok:tk.length?tk.every(t=>t.status==='done'):legacy, auto:true},
    {k:'channels', t:'Добавлен в каналы проекта', ok:ch.length?ch.every(t=>t.status==='done'):legacy, auto:true},
    {k:'method', t:'Ознакомлен с методологией роли', ok:!!a.method},
    ...(needSec?[{k:'security', t:'Пройден инструктаж по ИБ и правилам работы с данными заказчика', ok:!!a.security}]:[])
  ];
  return {items, done:items.filter(i=>i.ok).length, total:items.length};
}

function startHint(p){
  if(!p.start||['active','closing','closed'].includes(p.status)) return null;
  const d=Math.round((parseD(p.start)-parseD(today()))/864e5), dd=n=>`${n} ${plural(n,'день','дня','дней')}`;
  if(p.status==='ready') return d<=0?{t:`Старт был ${fmtD(p.start)} — запустите проект`,c:'late'}:{t:`Можно запускать, старт через ${dd(d)}`,c:'ok'};
  if(d<0) return {t:`Старт прошёл ${dd(-d)} назад`,c:'late'};
  if(d===0) return {t:'Старт сегодня',c:'late'};
  return d<=14?{t:`Старт через ${dd(d)}`,c:''}:null;
}

function attention(){
  const out=[], add=(ic_,t,id,late,tab)=>out.push({ic:ic_,t,id,late,tab});
  visibleProjects().forEach(p=>{
    if(ui.role==='pm'){
      if(p.status==='returned') add('undo-2',`«${p.name}» вернули на доработку`,p.id,true);
      (p.requests||[]).filter(q=>q.status==='pending').forEach(q=>add('key-round',`«${p.name}»: ${E(q.emp).name} просит доступ к «${T(q.tool).name}»`,p.id,false,'team'));

      if(p.status==='ready') add('rocket',`«${p.name}»: рабочие места готовы — запустите проект`,p.id,daysTo(p.start)<=0);
    }
    if(['active','ready'].includes(p.status)){
      const rd=daysTo(reviewDue(p)); if(rd<=14) add('shield-check',rd<0?`«${p.name}»: пересмотр доступов просрочен на ${dWord(-rd)}`:`«${p.name}»: пересмотр доступов до ${fmtD(reviewDue(p))}`,p.id,rd<=3);
      const ed=daysTo(p.end); if(ed<0) add('archive',`«${p.name}»: срок истёк ${fmtD(p.end)}, доступы не отозваны — завершите проект`,p.id,true);
      else if(ed<=30) add('calendar-clock',`«${p.name}» завершается ${fmtD(p.end)} — запланируйте закрытие`,p.id,false);
    }
    if(p.status==='closing') add('archive',`«${p.name}»: идёт отзыв доступов`,p.id,false);
  });
  return out.sort((a,b)=>b.late-a.late);
}

function wErrs(step,d){
  const e={};
  if(step===0){
    if(!d.name.trim()) e.name='Укажите название проекта';
    if(!d.code) e.code='Укажите код проекта';
    else if(!/^[A-Z0-9]{3,8}$/.test(d.code)) e.code='Код — от 3 до 8 латинских букв или цифр';
    else if(S.projects.some(p=>p.code===d.code&&p.id!==ui.wiz?.editId)) e.code=`Код ${d.code} уже занят другим проектом`;
    if(!d.start) e.start='Выберите дату старта';
    else if(d.start<today()&&!ui.wiz?.editId) e.start='Дата старта не может быть в прошлом';
    if(!d.end) e.end='Укажите дату окончания — до неё будут действовать доступы';
    else if(d.start&&d.end<=d.start) e.end='Окончание должно быть позже старта';
  }
  if(step===1&&d.clientInComms&&!d.clientReps.length) e.reps='Добавьте хотя бы одного представителя заказчика';
  if(step===2&&!d.team.length) e.team='Добавьте в команду хотя бы одного сотрудника';
  return e;
}

const AI_RATE={onprem:0.35,gigachat:1.2,yagpt:1.0}; // ₽ за 1000 токенов (оценка)
const WEEKS=8;
function aiUsage(p){
  const users=p.team.filter(m=>m.tools.some(t=>['llm','aide'].includes(t)));
  const res={users:users.length, weeks:Array(WEEKS).fill(0), blocked:{pd:0,sec:0,db:0}, tokens:0, cost:0};
  if(p.ai.llm==='none'||!users.length||!['active','ready','closing','closed','provisioning'].includes(p.status)) return res;
  let x=[...p.code].reduce((a,c)=>a*31+c.charCodeAt(0),7)%2147483647; const rnd=()=>(x=(x*48271)%2147483647)/2147483647;
  const now=parseD(today());
  for(let i=0;i<WEEKS;i++){
    const wk=new Date(now); wk.setDate(now.getDate()-7*(WEEKS-1-i)); const iso=isoD(wk);
    const live=iso>=p.start&&iso<=p.end&&(p.status==='active'||p.status==='closing'||(p.status==='closed'&&iso<=p.end));
    res.weeks[i]=live?Math.round(users.length*(35+rnd()*55)*(0.7+i*0.05)):0;
  }
  const last4=res.weeks.slice(-4).reduce((a,b)=>a+b,0);
  if(last4){ res.blocked.pd=Math.floor(rnd()*4)+(p.clientInComms?1:0); res.blocked.sec=Math.floor(rnd()*3); res.blocked.db=p.model==='bank'?1:Math.floor(rnd()*2) }
  res.tokens=last4*(1400+Math.round(rnd()*900)); res.cost=Math.round(res.tokens/1000*(AI_RATE[p.ai.llm]||1));
  return res;
}

/* ========= Кастомные выпадающие списки ========= */
const CHEV='<svg class="dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
const TICK='<svg class="dd-tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const ddLabel=(t,inline)=>{const [a,b]=String(t).split(' — ');return b?`${esc(a)}${inline?`<small>${esc(b)}</small>`:`<small>${esc(b)}</small>`}`:esc(a)};
let dd=null; // {sel, btn, pop, act}
function enhanceSelects(root=document){
  root.querySelectorAll('select:not(.sr-select)').forEach(sel=>{
    sel.classList.add('sr-select'); sel.tabIndex=-1; sel.setAttribute('aria-hidden','true');
    const wrap=document.createElement('div'); wrap.className='dd';
    sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(sel);
    const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn';
    btn.setAttribute('role','combobox'); btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false'); btn.setAttribute('aria-controls','dd-pop'); btn.disabled=sel.disabled;
    const lbl=sel.closest('.field')?.querySelector('label'); btn._lbl=(lbl?lbl.textContent:sel.getAttribute('aria-label'))||'';
    const val=sel.options[sel.selectedIndex]?.text||''; if(btn._lbl) btn.setAttribute('aria-label',`${btn._lbl}: ${val}`);
    btn.innerHTML=`<span class="dd-val">${ddLabel(val,true)}</span>${CHEV}`;
    wrap.appendChild(btn); btn._sel=sel;
  });
}
function ddOpen(btn){
  ddClose(); const sel=btn._sel, r=btn.getBoundingClientRect();
  const pop=document.createElement('div'); pop.className='dd-pop'; pop.id='dd-pop'; pop.setAttribute('role','listbox');
  const big=sel.options.length>10;
  pop.innerHTML=(big?`<div class="dd-search">${ic('search')}<input type="search" class="dd-q" placeholder="Поиск по ${sel.options.length} вариантам" aria-label="Поиск в списке" aria-controls="dd-pop" autocomplete="off"></div><div class="dd-empty" hidden>Ничего не найдено</div>`:'')+
    [...sel.options].map((o,i)=>`<div class="dd-opt" role="option" id="dd-opt-${i}" data-i="${i}" aria-selected="${i===sel.selectedIndex}">${TICK}<div>${ddLabel(o.text)}</div></div>`).join('');
  document.body.appendChild(pop);
  if(big) icons();
  pop.style.minWidth=r.width+'px'; pop.style.maxWidth=Math.max(r.width,360)+'px';
  const h=pop.offsetHeight, below=innerHeight-r.bottom-8;
  pop.style.top=(below<h&&r.top>below? r.top-h-4 : r.bottom+4)+'px';
  pop.style.left=Math.min(r.left, innerWidth-pop.offsetWidth-8)+'px';
  btn.setAttribute('aria-expanded','true');
  dd={sel,btn,pop,act:Math.max(0,sel.selectedIndex),vis:[...sel.options].map((_,i)=>i)}; ddHi();
  if(big){const q=pop.querySelector('.dd-q'); q.focus(); q.setAttribute('aria-activedescendant','dd-opt-'+dd.act)}
}
function ddFilter(q){
  q=q.trim().toLowerCase(); dd.vis=[];
  dd.pop.querySelectorAll('.dd-opt').forEach(o=>{const ok=!q||o.textContent.toLowerCase().includes(q); o.hidden=!ok; if(ok) dd.vis.push(+o.dataset.i)});
  dd.pop.querySelector('.dd-empty').hidden=dd.vis.length>0;
  if(!dd.vis.includes(dd.act)) dd.act=dd.vis[0]??-1; ddHi();
}
function ddHi(){if(!dd)return; dd.pop.querySelectorAll('.dd-opt').forEach(o=>o.classList.toggle('act',+o.dataset.i===dd.act)); dd.btn.setAttribute('aria-activedescendant','dd-opt-'+dd.act); dd.pop.querySelector('.dd-q')?.setAttribute('aria-activedescendant','dd-opt-'+dd.act); ddScroll()}
function ddScroll(){const o=dd.pop.querySelector('#dd-opt-'+dd.act); if(!o) return; const pr=dd.pop, top=pr.querySelector('.dd-search')?.offsetHeight||0; if(o.offsetTop-top<pr.scrollTop) pr.scrollTop=o.offsetTop-top-4; else if(o.offsetTop+o.offsetHeight>pr.scrollTop+pr.clientHeight) pr.scrollTop=o.offsetTop+o.offsetHeight-pr.clientHeight+4}
function ddClose(focus){if(!dd)return; dd.pop.remove(); dd.btn.setAttribute('aria-expanded','false'); dd.btn.removeAttribute('aria-activedescendant'); if(focus) dd.btn.focus(); dd=null}
function ddPick(i){
  const {sel,btn}=dd; ddClose(true);
  if(sel.selectedIndex===i) return;
  sel.selectedIndex=i; btn.querySelector('.dd-val').innerHTML=ddLabel(sel.options[i].text,true); if(btn._lbl) btn.setAttribute('aria-label',`${btn._lbl}: ${sel.options[i].text}`);
  sel.dispatchEvent(new Event('change',{bubbles:true}));
}
document.addEventListener('mousedown',e=>{
  if(!dd) return;
  const o=e.target.closest('.dd-opt'); if(o&&dd.pop.contains(o)){e.preventDefault(); ddPick(+o.dataset.i); return}
  if(!dd.pop.contains(e.target)&&!dd.btn.contains(e.target)) ddClose();
});
document.addEventListener('click',e=>{const b=e.target.closest('.dd-btn:not(.dp-btn)'); if(!b) return; if(dd&&dd.btn===b) ddClose(); else ddOpen(b)});
document.addEventListener('mouseover',e=>{if(!dd)return; const o=e.target.closest('.dd-opt'); if(o&&dd.pop.contains(o)){dd.act=+o.dataset.i; ddHi()}});
document.addEventListener('keydown',e=>{
  const b=e.target.closest?.('.dd-btn:not(.dp-btn)');
  if(!dd){ if(b&&['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){e.preventDefault(); ddOpen(b)} return }
  const v=dd.vis, inQ=e.target.classList?.contains('dd-q'), k=v.indexOf(dd.act);
  if(e.key==='ArrowDown'){e.preventDefault(); if(v.length){dd.act=v[(k+1)%v.length]; ddHi()}}
  else if(e.key==='ArrowUp'){e.preventDefault(); if(v.length){dd.act=v[(k-1+v.length)%v.length]; ddHi()}}
  else if((e.key==='Home'||e.key==='End')&&!inQ){e.preventDefault(); if(v.length){dd.act=e.key==='Home'?v[0]:v[v.length-1]; ddHi()}}
  else if(e.key==='Enter'||(e.key===' '&&!inQ)){e.preventDefault(); if(dd.act>=0) ddPick(dd.act)}
  else if(e.key==='Escape'||e.key==='Tab'){ if(e.key==='Escape') e.preventDefault(); ddClose(e.key==='Escape')}
});
addEventListener('resize',()=>ddClose());
addEventListener('scroll',e=>{if(dd&&!dd.pop.contains(e.target)) ddClose()},true);

/* ========= Кастомный календарь ========= */
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const pad2=n=>String(n).padStart(2,'0');
const isoD=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const parseD=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const longD=d=>`${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
const CAL='<svg class="dp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';
const ARR=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d==='l'?'m15 18-6-6 6-6':'m9 18 6-6-6-6'}"/></svg>`;
let dp=null; // {inp, btn, pop, cur}
function dpLabel(btn){const d=parseD(btn._inp.value); btn.querySelector('.dd-val').className='dd-val'+(d?'':' ph'); btn.querySelector('.dd-val').textContent=d?longD(d):'Выберите дату'; btn.setAttribute('aria-label',`${btn._lbl||'Дата'}: ${d?longD(d):'не выбрана'}`)}
function enhanceDates(root=document){
  root.querySelectorAll('input[type=date]:not(.sr-select)').forEach(inp=>{
    inp.classList.add('sr-select'); inp.tabIndex=-1; inp.setAttribute('aria-hidden','true');
    const wrap=document.createElement('div'); wrap.className='dd';
    inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp);
    const btn=document.createElement('button'); btn.type='button'; btn.className='dd-btn dp-btn';
    btn.setAttribute('aria-haspopup','dialog'); btn.setAttribute('aria-expanded','false');
    const lbl=inp.closest('.field')?.querySelector('label'); btn._lbl=lbl?lbl.textContent.replace(' *',''):'Дата';
    btn.innerHTML=`<span class="dd-val"></span>${CAL}`; btn._inp=inp; wrap.appendChild(btn); dpLabel(btn);
  });
}
function dpOpen(btn){
  ddClose(); dpClose();
  const pop=document.createElement('div'); pop.className='dd-pop dp-pop'; pop.setAttribute('role','dialog'); pop.setAttribute('aria-label','Выбор даты');
  document.body.appendChild(pop);
  dp={inp:btn._inp, btn, pop, cur:parseD(btn._inp.value)||new Date()};
  dpRender(); btn.setAttribute('aria-expanded','true');
  const r=btn.getBoundingClientRect(), h=pop.offsetHeight, below=innerHeight-r.bottom-8;
  pop.style.top=(below<h&&r.top>below? r.top-h-4 : r.bottom+4)+'px';
  pop.style.left=Math.max(8,Math.min(r.left, innerWidth-pop.offsetWidth-8))+'px';
  dpFocus();
}
function dpRender(){
  const {cur,inp,pop}=dp, y=cur.getFullYear(), m=cur.getMonth();
  const sel=inp.value, tod=isoD(new Date()), min=inp.min||'';
  const first=new Date(y,m,1), shift=(first.getDay()+6)%7, start=new Date(y,m,1-shift);
  let days='';
  for(let i=0;i<42;i++){const d=new Date(start); d.setDate(start.getDate()+i); const id=isoD(d);
    const off=min&&id<min;
    days+=`<button type="button" class="dp-day${d.getMonth()!==m?' out':''}${id===tod?' today':''}${id===sel?' sel':''}${off?' off':''}" data-d="${id}" tabindex="${id===isoD(cur)?0:-1}" aria-label="${longD(d)}${off?', недоступно':''}"${off?' aria-disabled="true"':''}${id===sel?' aria-pressed="true"':''}>${d.getDate()}</button>`}
  pop.innerHTML=`<div class="dp-h"><b aria-live="polite">${MONTHS[m]} ${y}</b><button type="button" class="dp-nav" data-nav="-1" aria-label="Предыдущий месяц">${ARR('l')}</button><button type="button" class="dp-nav" data-nav="1" aria-label="Следующий месяц">${ARR('r')}</button></div>
  <div class="dp-grid">${WD.map(w=>`<span class="dp-wd">${w}</span>`).join('')}${days}</div>
  <div class="dp-f"><button type="button" class="dp-link" data-dp="clear">Очистить</button><button type="button" class="dp-link" data-dp="today">Сегодня</button></div>`;
}
function dpFocus(){dp?.pop.querySelector('.dp-day[tabindex="0"]')?.focus()}
function dpClose(focus){if(!dp)return; dp.pop.remove(); dp.btn.setAttribute('aria-expanded','false'); if(focus) dp.btn.focus(); dp=null}
function dpSet(v){
  const {inp,btn}=dp; inp.value=v; dpLabel(btn); dpClose(true);
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
function dpMove(days,months){const c=new Date(dp.cur); if(months) c.setMonth(c.getMonth()+months); else c.setDate(c.getDate()+days); dp.cur=c; dpRender(); dpFocus()}
document.addEventListener('click',e=>{
  const b=e.target.closest('.dp-btn'); if(b){ if(dp&&dp.btn===b) dpClose(); else dpOpen(b); return }
  if(!dp||!dp.pop.contains(e.target)) return;
  const day=e.target.closest('.dp-day'); if(day){ if(day.getAttribute('aria-disabled')==='true') return; return dpSet(day.dataset.d) }
  const nav=e.target.closest('[data-nav]'); if(nav){const c=new Date(dp.cur.getFullYear(),dp.cur.getMonth()+(+nav.dataset.nav),1); dp.cur=c; dpRender(); nav.dataset.nav==='-1'?dp.pop.querySelector('[data-nav="-1"]').focus():dp.pop.querySelector('[data-nav="1"]').focus(); return}
  const a=e.target.closest('[data-dp]'); if(a) return dpSet(a.dataset.dp==='today'?isoD(new Date()):'');
});
document.addEventListener('mousedown',e=>{if(ui.bell&&!e.target.closest?.('.bell-wrap')){ui.bell=false; document.querySelector('.notif-pop')?.remove(); document.querySelector('.bell')?.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.bell){ui.bell=false; document.querySelector('.notif-pop')?.remove(); const b=document.querySelector('.bell'); b?.setAttribute('aria-expanded','false'); b?.focus({preventScroll:true})}});
document.addEventListener('mousedown',e=>{if(dp&&!dp.pop.contains(e.target)&&!dp.btn.contains(e.target)) dpClose()});
document.addEventListener('keydown',e=>{
  if(!dp) return;
  if(e.key==='Escape'){e.preventDefault(); dpClose(true); return}
  if(!e.target.classList?.contains('dp-day')) { if(e.key==='Tab'&&!dp.pop.contains(e.target)) dpClose(); return }
  const k={ArrowLeft:[-1],ArrowRight:[1],ArrowUp:[-7],ArrowDown:[7],PageUp:[0,-1],PageDown:[0,1]}[e.key];
  if(k){e.preventDefault(); dpMove(k[0],k[1]); return}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('aria-disabled')==='true'){e.preventDefault(); return}
  if(e.key==='Home'){e.preventDefault(); dpMove(-((dp.cur.getDay()+6)%7))}
  else if(e.key==='End'){e.preventDefault(); dpMove(6-((dp.cur.getDay()+6)%7))}
});
addEventListener('resize',()=>dpClose());
addEventListener('scroll',e=>{if(dp&&!dp.pop.contains(e.target)) dpClose()},true);

/* ========= Подсказки ⓘ: слой поверх страницы, не обрезается контейнерами ========= */
let tipEl=null;
function showTip(b){
  if(tipEl&&tipEl._for===b) return; hideTip();
  tipEl=document.createElement('div'); tipEl.className='tip-pop'; tipEl.id='tip-pop'; tipEl.setAttribute('role','tooltip'); tipEl.textContent=b.dataset.tip; tipEl._for=b;
  document.body.appendChild(tipEl);
  const r=b.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  const left=Math.min(Math.max(8,r.left+r.width/2-w/2), innerWidth-w-8);
  const top=r.top-h-8<8?r.bottom+8:r.top-h-8;
  tipEl.style.left=left+'px'; tipEl.style.top=top+'px'; b.setAttribute('aria-describedby','tip-pop');
}
function hideTip(){ if(tipEl){tipEl._for?.removeAttribute('aria-describedby'); tipEl.remove(); tipEl=null} }
document.addEventListener('mouseover',e=>{const b=e.target.closest?.('.tip'); if(b) showTip(b)});
document.addEventListener('mouseout',e=>{const b=e.target.closest?.('.tip'); if(b&&!b.contains(e.relatedTarget)) hideTip()});
document.addEventListener('focusin',e=>{const b=e.target.closest?.('.tip'); if(b) showTip(b)});
document.addEventListener('focusout',e=>{if(e.target.closest?.('.tip')) hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape') hideTip()});
addEventListener('scroll',hideTip,true);

/* ========= Модальное окно ========= */
function modal({title, body, ok='Готово', danger=false, onOk}){
  const prev=document.activeElement;
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(title)}</h2><div class="m-b">${body}</div><div class="m-f"><button class="btn" data-m="cancel">Отмена</button><button class="btn ${danger?'red':'pri'}" data-m="ok">${esc(ok)}</button></div></div>`;
  document.body.appendChild(bg); enhanceSelects(bg); enhanceDates(bg);
  const close=()=>{ddClose(); bg.remove(); document.removeEventListener('keydown',key,true); prev?.focus?.()};
  const confirm=()=>{if(onOk&&onOk()===false) return; close()};
  const key=e=>{
    if(dd||dp||e.target.closest?.('.dd-btn')) return;
    if(e.key==='Escape'){e.preventDefault(); close()}
    else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey||e.target.tagName!=='TEXTAREA')){e.preventDefault(); confirm()}
    else if(e.key==='Tab'){const f=[...bg.querySelectorAll('button,textarea,input')]; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault(); f[f.length-1].focus()} else if(!e.shiftKey&&i===f.length-1){e.preventDefault(); f[0].focus()}}
  };
  document.addEventListener('keydown',key,true);
  bg.addEventListener('mousedown',e=>{if(e.target===bg) close()});
  bg.querySelector('[data-m=cancel]').onclick=close;
  bg.querySelector('[data-m=ok]').onclick=confirm;
  icons();
  (bg.querySelector('textarea,input')||bg.querySelector('[data-m=ok]')).focus();
}

  if(ui.view==='wizard') wSyncErr();
  saveWiz();

function routeOf(){
  if(ui.view==='project') return `#/project/${ui.pid}/${ui.tab}`;
  if(ui.view==='wizard') return `#/wizard/${(ui.wiz?.step??0)+1}`;
  return `#/${ui.view}`;
}
let lastRoute='';
function syncRoute(){const r=routeOf(); if(location.hash===r) return; lastRoute=r; try{history.pushState(null,'',r)}catch(_){try{location.hash=r}catch(__){}}}
function applyRoute(){
  const [,v,a,b]=(location.hash||'').split('/');
  if(!v) return false;
  if(v==='project'&&P(a)){ui.view='project'; ui.pid=a; ui.tab=b||'passport'; return true}
  if(v==='wizard'&&ui.role==='pm'){ui.view='wizard'; if(!ui.wiz) ui.wiz=newWiz(); const want=Math.max(0,Math.min(4,(+a||1)-1)); let st=0; while(st<want&&!wErr(st,ui.wiz.d)) st++; ui.wiz.step=st; return true}
  if(NAV[ui.role].some(([x])=>x===v)){ui.view=v; return true}
  return false;
}
addEventListener('popstate',()=>{if(ui.session&&applyRoute()){render(false); window.scrollTo(0,0)}});
addEventListener('hashchange',()=>{if(ui.session&&location.hash!==lastRoute&&applyRoute()){render(false); window.scrollTo(0,0)}});

    modal({title:'Запросить доступ', body:`<div class="stack"><div class="field"><label for="mTool">Инструмент</label><select id="mTool">${avail.map(t=>`<option value="${t.id}">${esc(t.name)} — ${r.opt.includes(t.id)?'в шаблоне роли':'вне шаблона роли'}</option>`).join('')}</select></div>
      <div class="field"><label for="mWhy">Зачем нужен</label><textarea id="mWhy" placeholder="Например: проверять данные в тестовой базе по задаче регресса"></textarea><span class="hint">Запрос получит руководитель проекта ${esc(E(p.pm).name)}.</span><span class="ferr" id="e-mWhy"></span></div></div>`, ok:'Отправить запрос',
      onOk:()=>{const why=$('#mWhy').value.trim(); if(!why){$('#e-mWhy').textContent='Опишите, зачем нужен доступ'; $('#mWhy').focus(); return false}
        const tool=$('#mTool').value; (p.requests??=[]).push({id:'RQ-'+Date.now(),emp:ui.me,tool,reason:why,d:today(),status:'pending'});
        p.history.push({d:today(),t:`${E(ui.me).name} запросил доступ к «${T(tool).name}»`}); save(); render(); notify('pm',`${E(ui.me).name} просит доступ к «${T(tool).name}» на «${p.name}»`,p.id,{user:p.pm,ic:'key-round',tab:'team'}); toast('Запрос отправлен руководителю проекта')}})},
  rqok:el=>{const p=P(el.dataset.id), q=p.requests.find(x=>x.id===el.dataset.rq), m=p.team.find(x=>x.emp===q.emp);
    q.status='approved'; if(m&&!m.tools.includes(q.tool)){m.tools.push(q.tool); genGrant(S,p,{emp:q.emp,role:m.role,tools:[q.tool]},false)}
    p.history.push({d:today(),t:`Запрос ${E(q.emp).name} на «${T(q.tool).name}» одобрен, заявка ушла в сервис-деск`}); save(); render(); notify('emp',`Запрос на «${T(q.tool).name}» одобрен, заявка ушла в сервис-деск`,p.id,{user:q.emp,ic:'circle-check'}); toast('Одобрено, заявка на выдачу создана')},
  rqno:el=>{const p=P(el.dataset.id), q=p.requests.find(x=>x.id===el.dataset.rq);

  emore:()=>{ui.elimit=(ui.elimit||50)+50; const t=$('#elist'); if(t){t.innerHTML=peopleList(); icons()}},
  login:el=>{const r=el?.dataset?.k||'pm'; const user=DEMO_USERS[r].emp||r; ui.lastRole=r;
    ui.session={role:r,user}; ui.role=r; if(r==='emp') ui.me=user;
    try{localStorage.setItem(KEY+'-session',JSON.stringify(ui.session)); localStorage.setItem(KEY+'-role',r)}catch(_){}
    ui.view=NAV[r][0][0]; ui.menu=false; window.scrollTo(0,0); render(); $('#main')?.focus({preventScroll:true}); window.scrollTo(0,0); toast(`Вход выполнен: ${sessName()}`)},
  logout:()=>{const n=sessName(); ui.session=null; ui.menu=false; try{localStorage.removeItem(KEY+'-session')}catch(_){} try{history.pushState(null,'',location.pathname+location.search)}catch(_){try{location.hash=''}catch(__){}} render(); toast('Вы вышли из портала'); document.querySelector(`.role-card[data-k="${ui.lastRole}"]`)?.focus()},
  ack:el=>{const p=P(el.dataset.id), k=el.dataset.k; (p.acks??={}); (p.acks[ui.me]??={})[k]=today(); p.history.push({d:today(),t:`${E(ui.me).name}: ${k==='method'?'ознакомился с методологией роли':'прошёл инструктаж по ИБ'}`}); save(); render(); toast(k==='method'?'Ознакомление отмечено':'Инструктаж отмечен')},
  close:el=>{const p=P(el.dataset.id); const n=p.team.reduce((a,m)=>a+m.tools.length,0);
    modal({title:`Завершить «${p.name}»?`, body:`<p>Служба поддержки получит заявки на отзыв <b>${n} ${plural(n,'доступа','доступов','доступов')}</b> у ${p.team.length} ${plural(p.team.length,'сотрудника','сотрудников','сотрудников')}. Каналы, ключ ИИ и репозитории переведут в архив. Проект закроется, когда все заявки будут выполнены.</p><p class="small muted">Отменить завершение нельзя.</p>`, ok:'Завершить проект', danger:true,
      onOk:()=>{p.status='closing'; const k=genRevoke(S,p,p.team,'full').length; notify('support',`Заявки на отзыв доступов по «${p.name}»: ${k}`,p.id,{ic:'archive',tab:'tickets'}); p.history.push({d:today(),t:`Проект завершается. Заявок на отзыв доступов: ${k}`}); save(); render(); toast(`Создано ${k} ${plural(k,'заявка','заявки','заявок')} на отзыв доступов`)}})},
  madd:el=>{const p=P(el.dataset.id); const avail=S.emps.filter(e=>!p.team.some(m=>m.emp===e.id));
    if(!avail.length){toast('Все сотрудники уже в команде'); return}
    modal({title:'Добавить сотрудника в команду', body:`<div class="stack"><div class="field"><label for="mEmp">Сотрудник</label><select id="mEmp">${empOptions(avail)}</select></div>
      <div class="field"><label for="mRole">Роль на проекте</label><select id="mRole"><option value="">Роль по профилю</option>${S.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><span class="hint">Доступы выдадут по шаблону роли. Опциональные инструменты можно добавить позже.</span></div></div>`, ok:'Добавить и создать заявки',
      onOk:()=>{const emp=$('#mEmp').value, role=$('#mRole').value||E(emp).role; const m={emp, role, tools:[...R(role).req]}; p.team.push(m); (p.tplVer??={})[role]??=R(role).v||1; const k=genGrant(S,p,m).length; p.history.push({d:today(),t:`В команду добавлен ${E(emp).name} (${R(role).name}). Заявок: ${k}`}); save(); render(); notify('emp',`Вас добавили в проект «${p.name}»`,p.id,{user:emp,ic:'user-plus'}); notify('support',`Новые заявки по «${p.name}»: ${k} (новый участник)`,p.id,{ic:'ticket',tab:'tickets'}); toast(`${E(emp).name} добавлен, создано ${k} ${plural(k,'заявка','заявки','заявок')}`)}})},
  mrem:el=>{const p=P(el.dataset.id), m=p.team.find(x=>x.emp===el.dataset.emp);
    modal({title:`Убрать ${E(m.emp).name} с проекта?`, body:`<p>Будут созданы заявки на отзыв ${m.tools.length} ${plural(m.tools.length,'доступа','доступов','доступов')} и исключение из каналов проекта.</p>`, ok:'Убрать и отозвать доступы', danger:true,
      onOk:()=>{p.team=p.team.filter(x=>x!==m); const k=genRevoke(S,p,[m],'member').length; p.history.push({d:today(),t:`${E(m.emp).name} убран с проекта. Заявок на отзыв: ${k}`}); save(); render(); toast(`Создано ${k} ${plural(k,'заявка','заявки','заявок')} на отзыв доступов`)}})},
  review:el=>{const p=P(el.dataset.id);
    modal({title:`Пересмотр доступов «${p.name}»`, body:`<p class="small">Снимите отметку с доступов, которые сотруднику больше не нужны. Для них создадутся заявки на отзыв.</p>
      ${p.team.map(m=>`<fieldset class="rv"><legend>${esc(E(m.emp).name)} <span class="muted small">${esc(R(m.role).name)}</span></legend>${m.tools.map(t=>`<label class="rv-i"><input type="checkbox" checked data-emp="${m.emp}" data-tool="${t}">${esc(T(t).name)}${R(m.role).req.includes(t)?' <span class="faint small">обязательный для роли</span>':''}</label>`).join('')}</fieldset>`).join('')}`, ok:'Подтвердить пересмотр',
      onOk:()=>{const off=[...document.querySelectorAll('.rv-i input:not(:checked)')].map(i=>({emp:i.dataset.emp,tool:i.dataset.tool})); const total=p.team.reduce((a,m)=>a+m.tools.length,0);
        const byEmp={}; off.forEach(o=>(byEmp[o.emp]??=[]).push(o.tool));
        Object.entries(byEmp).forEach(([emp,tools])=>{const m=p.team.find(x=>x.emp===emp); m.tools=m.tools.filter(t=>!tools.includes(t)); genRevoke(S,p,[{emp,tools}],'tools')});
        p.lastReview=today(); (p.reviews??=[]).push({d:today(),by:ROLES_UI[ui.role].t,kept:total-off.length,revoked:off.length});
        p.history.push({d:today(),t:`Пересмотр доступов (${ROLES_UI[ui.role].t}): подтверждено ${total-off.length}, отозвано ${off.length}`}); save(); render();
        toast(off.length?`Пересмотр сохранён, на отзыв ушло ${off.length} ${plural(off.length,'заявка','заявки','заявок')}`:'Пересмотр сохранён, все доступы подтверждены')}})},
  skip:()=>{const m=$('#main'); m?.focus(); m?.scrollIntoView()},
  pclear:()=>{ui.pq=''; ui.pst='all'; render(); $('#pq')?.focus()},
  wreset:()=>modal({title:'Начать заново?', body:'<p>Все поля мастера очистятся. Уже сохранённые черновики проектов не пострадают.</p>', ok:'Очистить мастер', danger:true, onOk:()=>{ui.wiz=newWiz(); render(); $('#f-name')?.focus()}}),
  rtool:el=>{const r=R(el.dataset.r), t=el.dataset.t, was=r.req.includes(t)?'req':r.opt.includes(t)?'opt':'off'; if(r.req.includes(t)){r.req=r.req.filter(x=>x!==t)} else if(r.opt.includes(t)){r.opt=r.opt.filter(x=>x!==t); r.req.push(t)} else r.opt.push(t);
    const st=x=>x==='req'?'обязательный':x==='opt'?'опциональный':'не используется';
    tplVersion(r,`«${T(t).name}»: ${st(was)} → ${st(r.req.includes(t)?'req':r.opt.includes(t)?'opt':'off')}`,'tool:'+t);
    save(); render(); toast(`${r.name}: «${T(t).name}» — ${r.req.includes(t)?'обязательный':r.opt.includes(t)?'опциональный':'не используется'}`)},
  // мастер
  wstep:el=>{const i=+el.dataset.i; for(let k=0;k<i;k++) if(wErr(k,ui.wiz.d)) {ui.wiz.step=k; ui.wiz.tried=k; render(); focusFirstErr(); return} ui.wiz.step=i; ui.wiz.tried=-1; render()},
  wnext:()=>{const w=ui.wiz; if(wErr(w.step,w.d)){w.tried=w.step; render(); focusFirstErr(); return} w.tried=-1; w.step++; window.scrollTo(0,0); render(); $('.steps .step.on')?.focus()},
  wprev:()=>{ui.wiz.step--; ui.wiz.tried=-1; render()},
  wmodel:el=>{applyModel(ui.wiz.d, el.dataset.k); render()},
  waddrep:()=>{const v=$('#repIn').value.trim(), c=$('#repContact').value.trim(), er=$('#e-repadd');
    const bad=!v?'Укажите ФИО и роль представителя':!c?'Укажите почту или ник в VK Teams — без контакта поддержка не сможет подключить представителя':!/^[^@\s]+@[^@\s]+\.[^@\s]+$|^@[\w.-]{2,}$/.test(c)?'Контакт: адрес почты (name@company.ru) или ник VK Teams (@name)':'';
    if(bad){ if(er) er.textContent=bad; ($(!v?'#repIn':'#repContact'))?.focus(); return }
    ui.wiz.d.clientReps.push(`${v} · ${c}`); render(); $('#repIn')?.focus()},
  wrmrep:el=>{ui.wiz.d.clientReps.splice(+el.dataset.i,1); render()},
  waddm:()=>{const emp=$('#empSel').value; const role=$('#roleSel').value||E(emp).role; ui.wiz.d.team.push({emp, role, tools:[...R(role).req]}); render()},
  wrmm:el=>{ui.wiz.d.team.splice(+el.dataset.i,1); render()},
  wtool:el=>{const m=ui.wiz.d.team[+el.dataset.i], t=el.dataset.t; m.tools=m.tools.includes(t)?m.tools.filter(x=>x!==t):[...m.tools,t]; render()},
  wsave:()=>{if(!ui.wiz.d.name.trim()||!ui.wiz.d.code){toast('Укажите название и код');return} const p=wizToProject(); save(); toast('Черновик сохранён'); render()},
  wsubmit:()=>{const w=ui.wiz; if(wErrAll(w.d)){w.tried=w.step; const f=$('#wfoot'); if(f){f.outerHTML=wFooter(); icons()} return} const p=wizToProject(); p.status='pending'; p.comment=''; p.history.push({d:today(),t:'Отправлен на утверждение'}); save(); ui.wiz=null; ui.pid=p.id; ui.tab='passport'; notify('ck',`Новый проект на утверждение: «${p.name}»`,p.id,{ic:'stamp'}); toast('Отправлено руководителю ЦК на утверждение'); go('project')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const keep=Object.entries(el.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())}="${CSS.escape(v)}"]`).join('');
  const was=ui.view+'|'+ui.pid;
  A[el.dataset.act]?.(el);
  // сменился экран или проект — показываем страницу с самого верха
  const moved=was!==ui.view+'|'+ui.pid; if(moved) window.scrollTo(0,0);
  // после перерисовки возвращаем фокус на тот же элемент — важно для клавиатуры (без прокрутки)
  if(!document.body.contains(el)&&(!document.activeElement||document.activeElement===document.body)){
    const id=el.dataset.id; const t=id&&S.tickets.find(x=>x.id===id);
    // точный элемент → тот же объект с другим действием → следующая открытая заявка в списке
    (document.querySelector(keep)||(id&&document.querySelector(`[data-id="${CSS.escape(id)}"]:is(button,a)`))||(t&&document.querySelector('.trow [data-act="tk"]'))||$('#main'))?.focus({preventScroll:true});
    if(moved) window.scrollTo(0,0);
  }
});
document.addEventListener('keydown',e=>{
  const rc=e.target.closest?.('.role-card'); if(!rc) return;
  const dir={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!dir) return;
  e.preventDefault(); const cs=[...document.querySelectorAll('.role-card')]; cs[(cs.indexOf(rc)+dir+cs.length)%cs.length].focus();
});
document.addEventListener('keydown',e=>{
  const mc=e.target.closest?.('.model-card'); if(!mc) return;
  const dir={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!dir) return;
  e.preventDefault(); const ks=Object.keys(CLIENT_MODELS); const n=ks[(ks.indexOf(mc.dataset.k)+dir+ks.length)%ks.length];
  applyModel(ui.wiz.d,n); render(); document.querySelector(`.model-card[data-k="${n}"]`)?.focus();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['repIn','repContact'].includes(e.target.id)){e.preventDefault();A.waddrep()}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.field==='role'){ui.role=el.value; try{localStorage.setItem(KEY+'-role',ui.role)}catch(_){} go(NAV[ui.role][0][0]); return}
  if(el.dataset.field==='me'){ui.me=el.value; render(); return}
  if(el.dataset.field==='lemp'){ui.loginEmp=el.value; render(); document.querySelector('#lEmp')?.parentNode.querySelector('.dd-btn')?.focus(); return}
  if(el.dataset.field==='tf'){ui.tf=el.value; render(); return}
  if(el.dataset.field==='pst'){ui.pst=el.value; render(); return}
  if(el.dataset.field==='psort'){ui.psort=el.value; render(); return}
  if(el.dataset.field==='ap'){ui.ap=el.value; ui.alimit=100; render(); return}
  if(el.dataset.field==='atype'){ui.atype=el.value; ui.alimit=100; render(); return}
  if(el.dataset.field==='erole'){ui.erole=el.value; ui.elimit=50; render(); return}
  if(el.dataset.field==='eload'){ui.eload=el.value; ui.elimit=50; render(); return}
  if(el.dataset.rm){const r=R(el.dataset.rm); r.method=el.value; tplVersion(r,'Изменена методология','method'); save(); render(); toast(`Методология сохранена, версия v${r.v}`); return}
  if(el.dataset.src){const d=ui.wiz.d,k=el.dataset.src; d.ai.sources=el.checked?[...d.ai.sources,k]:d.ai.sources.filter(x=>x!==k); render(); return}
  if(el.dataset.w){
    if(['text','date'].includes(el.type)) return wInput(el); // текст уже учтён — без перерисовки, чтобы не терять клик
    setW(el); render();
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList?.contains('dd-q')){ if(dd) ddFilter(el.value); return }
  if(el.id==='aq'){ui.aq=el.value; ui.alimit=100; const t=$('#alist'); if(t){t.innerHTML=auditList(); icons()} return}
  if(el.id==='eq'){ui.eq=el.value; ui.elimit=50; const t=$('#elist'); if(t){t.innerHTML=peopleList(); icons()} return}
  if(el.id==='pq'){ui.pq=el.value; const t=$('#ptable'); if(t){t.innerHTML=projTable(projFiltered()); icons()} return}
  if(el.id==='dq'){ui.dq=el.value; const t=$('#dlist'); if(t){t.innerHTML=deskList(); icons()} return}
  if(!e.isComposing) wInput(el);
});
document.addEventListener('compositionend',e=>wInput(e.target));
function wInput(el){
  if(!ui.wiz||!el.dataset||!el.dataset.w||!['text','date'].includes(el.type)) return;
  setW(el);
  // код проекта нормализуем прямо в поле, без перерисовки страницы
  if(el.dataset.w==='code'&&el.value!==ui.wiz.d.code){const pos=Math.min(el.selectionStart,ui.wiz.d.code.length); el.value=ui.wiz.d.code; try{el.setSelectionRange(pos,pos)}catch(_){}}
  wSyncErr(); saveWiz();
  const f=$('#wfoot'); if(f){f.outerHTML=wFooter(); icons();}
}
function setW(el){
  const d=ui.wiz.d, k=el.dataset.w; let v=el.type==='checkbox'?el.checked:el.value;
  if(k==='code') v=translit(v).replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(k.startsWith('ai.')) d.ai[k.slice(3)]=v; else d[k]=v;
  if(k==='clientInComms'&&v&&!d.ai.sources.includes('client')) d.ai.sources.push('client');
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tools) S=seed();
// миграция старых данных: единый термин «ИИ»
S.tools.forEach(t=>t.name=t.name.replace(/^AI-/,'ИИ-')); S.roles.forEach(r=>r.method=r.method.replace(/AI-/g,'ИИ-'));
S.roles.forEach(r=>{r.versions??=[{v:1,d:'2026-02-10',by:'Руководитель ЦК',ch:'Первая версия шаблона'}]; r.v??=r.versions.length});
S.notifs??=[]; S.projects.forEach(p=>{ p.requests??=[]; if(!p.end){const d=parseD(p.start)||new Date(); d.setMonth(d.getMonth()+6); p.end=isoD(d)} p.acks??={}; p.reviews??=[]; if(p.lastReview===undefined) p.lastReview=null; });
S.tickets.forEach(t=>{t.op??='grant'; t.at??=Date.now()});
try{const w=JSON.parse(localStorage.getItem(KEY+'-wiz')); if(w&&w.d){w.d.end??=''; ui.wiz=w}}catch(e){}
try{ui.session=JSON.parse(localStorage.getItem(KEY+'-session'))}catch(e){}
if(ui.session){ui.role=ui.session.role; if(ui.role==='emp') ui.me=ui.session.user}
ui.lastRole=ui.session?.role||(()=>{try{return localStorage.getItem(KEY+'-role')}catch(e){}})()||'';
if(ui.session&&!applyRoute()&&!NAV[ui.role].some(([x])=>x===ui.view)) ui.view=NAV[ui.role][0][0];
render(false);
if(ui.session) try{history.replaceState(null,'',routeOf())}catch(e){}
</script>
