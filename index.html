<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цифровое рабочее место</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2F7; --surface:#FFFFFF; --surface-2:#F5F8FB; --line:#D6DEE8; --line-strong:#B8C4D3;
  --ink:#0F1B2D; --ink-2:#34445A; --muted:#556479; --faint:#5F6E83; --field:#8796AA;
  --accent:#1F4FBF; --accent-2:#3B6FE0; --accent-soft:#E3EDFC;
  --ok:#136C37; --ok-soft:#E3F4E8;
  --red:#B4372B; --red-soft:#F7E4E1; --amber:#86560C; --amber-soft:#F6EBD6; --blue:#0369A1; --blue-soft:#E0F2FE;
  --side:#0F1B2D; --side-ink:#C9D5E6; --side-mute:#8796AE; --side-on:#1C2B44;
  --doc:#F8FAFD; --doc-line:#CAD5E3;
  --r-s:4px; --r-m:8px; --r-l:14px;
  --display:"Unbounded",system-ui,sans-serif; --ui:"Onest",system-ui,-apple-system,sans-serif; --code:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B1220; --surface:#111A2B; --surface-2:#162236; --line:#22314A; --line-strong:#304260;
    --ink:#E4EAF3; --ink-2:#C0CBDB; --muted:#93A1B5; --faint:#8090A6; --field:#5A6F8F;
    --accent:#7AA7FF; --accent-2:#A3C3FF; --accent-soft:#16264A;
    --ok:#4ADE80; --ok-soft:#10301E;
    --red:#F08A7C; --red-soft:#3A1E1A; --amber:#E2AE55; --amber-soft:#33270F; --blue:#7DD3FC; --blue-soft:#0E2A3D;
    --side:#070D18; --side-ink:#C9D5E6; --side-mute:#8796AE; --side-on:#162236;
    --doc:#121D30; --doc-line:#2A3B57;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1220; --surface:#111A2B; --surface-2:#162236; --line:#22314A; --line-strong:#304260;
    --ink:#E4EAF3; --ink-2:#C0CBDB; --muted:#93A1B5; --faint:#8090A6; --field:#5A6F8F;
    --accent:#7AA7FF; --accent-2:#A3C3FF; --accent-soft:#16264A;
    --ok:#4ADE80; --ok-soft:#10301E;
    --red:#F08A7C; --red-soft:#3A1E1A; --amber:#E2AE55; --amber-soft:#33270F; --blue:#7DD3FC; --blue-soft:#0E2A3D;
    --side:#070D18; --side-ink:#C9D5E6; --side-mute:#8796AE; --side-on:#162236;
    --doc:#121D30; --doc-line:#2A3B57;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--code);font-size:13px;letter-spacing:0}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.2}

/* --- каркас --- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:22px 14px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:2px 10px 26px}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;font:700 10px/1 var(--display);letter-spacing:.02em;color:#fff;flex:none}
:root[data-theme="dark"] .brand .logo{background:var(--accent-2);color:var(--side)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .logo{background:var(--accent-2);color:var(--side)}}
.brand b{font:600 14px/1 var(--display);letter-spacing:-.01em;color:#fff;white-space:nowrap}
:root[data-theme="dark"] .brand b{color:var(--side-ink)}
.nav-label{font-size:12.5px;color:var(--side-mute);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-m);cursor:pointer;color:var(--side-ink);border:0;background:none;text-align:left;width:100%;font-size:14.5px}
.nav span:first-child{width:18px;text-align:center;opacity:.6}
.nav:hover{background:var(--side-on)}
.nav.on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 var(--accent-2)}
.nav.on span:first-child{opacity:1}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;border-radius:var(--r-s);font-size:12px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--side-mute);padding:10px;line-height:1.4}
.side-foot .btn{background:transparent;border-color:var(--side-on);color:var(--side-ink);margin-top:12px}
.side-foot .btn:hover{background:var(--side-on)}
main{min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 36px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.topbar h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.content{padding:28px 36px 72px;max-width:1240px}

/* --- поля --- */
select,input[type=text],input[type=search],input[type=date],input[type=email],textarea{background:var(--surface);border:1px solid var(--field);border-radius:var(--r-m);padding:9px 12px;min-width:0;min-height:40px;transition:border-color .12s}
select{padding-right:30px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;color:var(--ink-2);font-weight:500}
.field .hint{font-size:12.5px;color:var(--muted)}
.field input,.field select{width:100%}

/* --- кнопки --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-m);padding:8px 16px;min-height:40px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok:hover{background:var(--accent-2)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.ok{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.ok{color:#0B1220}}

/* --- поверхности --- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.card-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font:600 15px/1.3 var(--ui);letter-spacing:0}
.card-b{padding:18px 20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* приветствие + полоса показателей */
.hello h2{font-size:26px;margin:0 0 8px;max-width:34ch}
.hello p{margin:0;color:var(--muted);max-width:62ch}
.statline{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.statline>div{padding:16px 18px 14px;border-left:1px solid var(--line)}
.statline>div:first-child{border-left:0;padding-left:0}
.statline .v{font:600 34px/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.statline .l{color:var(--muted);font-size:13.5px;margin-top:8px}
.statline .v.alert{color:var(--red)}

/* таблицы */
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
/* таблицы в карточке: шапка и строки не выходят за скруглённые углы */
.tbl-wrap{overflow-x:auto}
.card>.tbl-wrap:first-child{border-top-left-radius:calc(var(--r-m) - 1px);border-top-right-radius:calc(var(--r-m) - 1px)}
.card>.tbl-wrap:last-child,.card>:last-child>.tbl-wrap:last-child{border-bottom-left-radius:calc(var(--r-m) - 1px);border-bottom-right-radius:calc(var(--r-m) - 1px)}
th:has(.tip){white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tr.click:hover td:first-child b{text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}

/* бейджи: квадратные метки с точкой */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-s);padding:2px 8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-grey{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--amber-soft);color:var(--amber)}
.b-bad{background:var(--red-soft);color:var(--red)}
.b-info{background:var(--blue-soft);color:var(--blue)}
.b-vio{background:var(--accent-soft);color:var(--accent)}
.b-ready{background:transparent;color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.b-ok{background:var(--ok);color:#fff}
:root[data-theme="dark"] .b-ok{color:#0B1220}
:root[data-theme="dark"] .nav .cnt,:root[data-theme="dark"] .bell-n{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .cnt,:root:not([data-theme="light"]) .bell-n{color:#0B1220}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .b-ok{color:#0B1220}}

/* чипы инструментов */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:var(--r-s);padding:4px 10px;font-size:13px;margin:0 6px 6px 0;background:var(--surface-2);line-height:1.35}
.chip.click{cursor:pointer;transition:border-color .12s,background .12s}.chip.click:hover{border-color:var(--accent)}
.chip.req{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
:root[data-theme="dark"] .chip.req{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.req{color:#0B1220}}
.chip.opt{background:var(--accent-soft);color:var(--accent)}
.chip.off{color:var(--faint);background:none;border:1px dashed var(--line-strong)}
.chip a{color:inherit;text-decoration:none;opacity:.6}.chip a:hover{opacity:1}

.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:22px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500;border-radius:8px 8px 0 0;transition:color .15s,background .15s}
.tab:hover{color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 50%,transparent)}
.tab.on{color:var(--accent);background:var(--accent-soft);border-bottom-color:var(--accent);font-weight:600}
.tab:focus-visible{outline-offset:-3px}

.progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent)}

.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--field);border-radius:var(--r-m);cursor:pointer;background:var(--surface)}
.check:hover{border-color:var(--accent)}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px}
.check.on{border-color:var(--accent);background:var(--accent-soft)}

/* шаги мастера — реальная последовательность */
.steps{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:24px;counter-reset:s}
.step{position:relative;padding:12px 12px 0 0;font-size:13.5px;color:var(--muted);cursor:pointer;border-top:3px solid var(--line)}
.step b{display:block;font:600 12px var(--display);color:var(--muted);margin-bottom:2px}
.step.on{border-top-color:var(--accent);color:var(--ink);font-weight:600}
.step.on b{color:var(--accent)}
.step.done{border-top-color:var(--accent-2);color:var(--ink-2)}
.step.done b{color:var(--accent-2)}
.step+.step{margin-left:6px}

.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.model-card{padding:16px;border:1px solid transparent;border-radius:var(--r-m);cursor:pointer;background:var(--surface);position:relative;box-shadow:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.04);transition:border-color .15s,box-shadow .15s}
.model-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.model-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(31,79,191,.10)}
.model-card.on:after{content:"✓";position:absolute;top:12px;right:14px;color:var(--accent);font-weight:700}
.mc-rules{display:flex;flex-direction:column;gap:5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);width:100%;font-size:12.5px;color:var(--muted)}
.mc-rules span{display:flex;align-items:center;gap:7px}
.mc-rules svg.lucide{width:14px;height:14px}
.mc-rules i{font-style:normal;color:var(--muted);min-width:66px}
.mc-rules span.on{color:var(--ink-2)}.mc-rules span.on svg.lucide{color:var(--accent)}
.model-card b{display:block;margin-bottom:6px;font-size:14.5px}

.member{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--surface)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--display);background:var(--accent-soft);color:var(--accent);flex:none}

/* шкала статусов */
.timeline{display:flex;margin:4px 0 0}
.tl{flex:1;position:relative;font-size:12.5px;color:var(--faint);padding-top:18px}
.tl:before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:var(--doc-line)}
.tl:after{content:"";position:absolute;top:0;left:0;box-sizing:border-box;width:12px;height:12px;border-radius:50%;background:var(--doc);border:2px solid var(--doc-line)}
.tl.done{color:var(--ink-2)}.tl.done:before{background:var(--accent)}.tl.done:after{background:var(--accent);border-color:var(--accent)}
.tl.cur{color:var(--ink);font-weight:600}.tl.cur:after{border-color:var(--accent);background:var(--doc);box-shadow:0 0 0 3px var(--accent-soft)}

/* схема-поток */
.flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:0}
.flow .node{flex:1;min-width:150px;border:1px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.flow .node b{display:block;font-size:14px;margin-bottom:4px;color:var(--ink)}
.flow .arr{display:grid;place-items:center;color:var(--line-strong);padding:0 4px;font-size:16px}

.kv{display:grid;grid-template-columns:190px 1fr;gap:10px 16px;font-size:14px;margin:0}
.mrules{list-style:none;margin:0;padding:4px 0}
.mrules li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 20px}
.mrules li+li{border-top:1px solid var(--line)}
.ru-ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--accent);display:grid;place-items:center}
.ru-ic svg.lucide{width:17px;height:17px}
.ru-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.ru-l{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:2px}
.ru-s{font-size:13px;color:var(--muted)}
.ru-v{font-size:13px;font-weight:600;padding:3px 10px;border-radius:var(--r-s);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.ru-v.on{background:var(--accent-soft);color:var(--accent)}
@media (max-width:520px){.mrules li{grid-template-columns:34px minmax(0,1fr);padding:12px 16px}.ru-v{grid-column:2;justify-self:start}}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:var(--r-m);font-size:14px;z-index:50;box-shadow:0 8px 24px rgba(15,27,45,.25);transition:opacity .3s}
.callout{border-left:3px solid var(--line-strong);background:var(--surface-2);padding:12px 16px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px;color:var(--ink-2);max-width:88ch}
.callout.warn{border-color:var(--amber);background:var(--amber-soft)}
.ret{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:var(--r-m);background:var(--amber-soft);font-size:13.5px;color:var(--ink-2);line-height:1.4}
.ret>svg.lucide{width:16px;height:16px;color:var(--amber);flex:none}
.ret-b{flex:1;min-width:0}
.ret-b b{color:var(--ink);font-weight:600}
.ret-hint{color:var(--muted)}
.ret-a{display:flex;gap:4px;flex:none}
.ret .btn.ghost{color:var(--ink)}
.ret .btn.ghost:hover{background:color-mix(in srgb,var(--amber) 14%,transparent)}
@media (max-width:760px){.ret{flex-wrap:wrap;padding:10px 12px}.ret-a{width:100%;justify-content:flex-end}}
.matrix td,.matrix th{padding:9px 10px;text-align:center;font-size:13px}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.st{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:var(--r-s);font-size:12px;font-weight:700;line-height:0;vertical-align:middle;flex:none}
.st svg.lucide{display:block;vertical-align:0}
.st.ok{background:var(--ok-soft);color:var(--ok)}.st.wip{background:var(--amber-soft);color:var(--amber)}.st.new{background:var(--accent-soft);color:var(--accent)}
.st.plan{background:transparent;color:var(--faint);box-shadow:none;outline:1px dashed var(--line-strong);outline-offset:-1px}
.menu-toggle{display:none}

/* --- UX-правки: ссылки-кнопки, ошибки, подсказки, поиск, печать --- */
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-m);border:1px solid var(--line-strong)}
.skip:focus{left:8px}
.content:focus{outline:none}
.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 40%,transparent);text-underline-offset:3px;text-align:left}
.linkbtn:hover{text-decoration-color:currentColor}
.linkbtn.pname{color:var(--ink);font-weight:600;text-decoration:none}
tr.click:hover .linkbtn.pname,.linkbtn.pname:hover{text-decoration:underline}
button.step{appearance:none;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:var(--muted)}
button.step.on{color:var(--ink)}
button.model-card{font:inherit;text-align:left;color:inherit;width:100%;display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start}
button.chip{font:inherit;font-size:13px;cursor:pointer}
.m-only{display:none}
@media (max-width:960px){.m-only{display:inline}}
.chip-x{border:0;background:none;padding:0 0 0 2px;margin-left:2px;color:var(--muted);cursor:pointer;display:inline-flex}
.chip-x:hover{color:var(--red)}
.chip-x svg.lucide{width:14px;height:14px}
.req-mark{color:var(--red)}
.stack>.req-note{margin-bottom:0}
.flabel{font-size:13.5px;color:var(--ink-2);font-weight:500}
.ferr{font-size:12.5px;color:var(--red);font-weight:500}
.ferr:empty{display:none}
input[aria-invalid="true"],textarea[aria-invalid="true"],.dd-btn[aria-invalid="true"]{border-color:var(--red)!important;box-shadow:0 0 0 3px var(--red-soft)}
.wiz-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:-8px 0 14px}
.wiz-top svg.lucide{width:15px;height:15px}
.wiz-top .linkbtn{margin-left:auto;font-size:13px}
.tip{border:0;background:none;padding:4px;margin:-4px -4px -4px 1px;min-width:24px;min-height:24px;align-items:center;justify-content:center;color:var(--muted);cursor:help;position:relative;display:inline-flex;vertical-align:-3px}
.tip svg.lucide{width:15px;height:15px}
.tip:hover,.tip:focus-visible{color:var(--accent)}
.tip-pop{position:fixed;z-index:120;max-width:280px;background:var(--ink);color:var(--paper);font:400 12.5px/1.45 var(--ui);padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(15,27,45,.25);pointer-events:none}
.shint{font-size:12.5px;color:var(--muted);margin-top:2px}
.ptable{table-layout:fixed}
.ptable .c-client{width:18%}.ptable .c-team{width:84px}.ptable .c-start{width:134px}.ptable .c-st{width:204px}.ptable .c-rd{width:172px}
.ptable td{vertical-align:middle;padding-top:14px;padding-bottom:14px}
.ptable .pname{font-weight:600;text-align:left;line-height:1.35}
.ptable th.num,.ptable td.num{text-align:center}
.tnum,.rd b{font-variant-numeric:tabular-nums}
.team-n{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.team-n svg.lucide{width:15px;height:15px;color:var(--muted)}
.rd-t{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--muted);margin-bottom:6px}
.rd-t span{flex:1}
.rd-t b{color:var(--ink);font-weight:600}
.rd-t b i{font-style:normal;font-weight:400;color:var(--muted)}
.rd-t svg.lucide{width:14px;height:14px;align-self:center}
.rd.full .rd-t{color:var(--ok)}
.rd.full .progress>i{background:var(--ok)}
.shint.late{color:var(--red);font-weight:500}
.shint.ok{color:var(--ok);font-weight:500}
.ptools{display:flex;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:220px}
.search svg.lucide{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;pointer-events:none}
.search input{width:100%;padding-left:34px}
ul.plain{margin:0;padding-left:20px;display:grid;gap:8px;max-width:80ch}
#toasts{position:fixed;right:24px;bottom:24px;display:flex;flex-direction:column;gap:8px;z-index:90;align-items:flex-end}
#toasts .toast{position:static;display:flex;align-items:center;gap:14px}
.toast-undo{border:0;background:none;color:inherit;font:600 14px var(--ui);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.dp-day.off{color:var(--line-strong);cursor:not-allowed;text-decoration:line-through}
.dp-day.off:hover{background:none}
@media print{
  aside,.topbar,.skip,.passport-actions,.tabs,#toasts,.callout,.wiz-top{display:none!important}
  .app{display:block}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .stamp{animation:none!important}
  .card,.passport{break-inside:avoid}
}

/* --- практики: готовность, пересмотр, SLA, внимание --- */
.ready-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--amber);margin-top:8px}
.ready-line.ok{color:var(--ok)}
.ready-line svg.lucide{width:15px;height:15px}
.team-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.team-bar>div:first-child{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.team-bar>div:first-child>.small{grid-column:2}
.team-bar>div:first-child>svg.lucide{color:var(--accent)}
.trow .ts{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.sla{font-size:12px;color:var(--muted);white-space:nowrap}
.sla.warn{color:var(--amber);font-weight:500}
.sla.late{color:var(--red);font-weight:600}
.op-revoke{color:var(--red);font-weight:500}
.attn{list-style:none;margin:0;padding:0}
.attn li+li{border-top:1px solid var(--line)}
.attn-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 20px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .15s}
.attn-row:hover{background:var(--surface-2)}
.attn-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.attn-row>span{flex:1;min-width:0}
.attn-row svg.lucide{color:var(--muted);flex:none}
.attn li.late .attn-row svg.lucide:first-child{color:var(--red)}
.attn li.late .attn-row>span{color:var(--ink);font-weight:500}
.attn-row svg.lucide:last-child{width:18px;height:18px;color:var(--faint,var(--muted));transition:transform .2s,color .2s}
.attn-row:hover svg.lucide:last-child{transform:translateX(3px);color:var(--accent)}
.checklist{border:0;border-radius:var(--r-m);padding:14px 16px;margin-bottom:18px;background:var(--surface-2)}
.cl-h{display:flex;justify-content:space-between;align-items:baseline}
.cl-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.cl-item>span{flex:1}
.cl-item svg.lucide{color:var(--faint)}
.cl-item.ok svg.lucide{color:var(--ok)}
.cl-item.ok>span{color:var(--muted)}
.modal .m-b{max-height:62vh;overflow:auto}
.modal .m-b select{width:100%}
fieldset.rv{border:0;background:var(--surface-2);border-radius:var(--r-m);margin:0 0 10px;padding:10px 14px}
fieldset.rv legend{float:left;width:100%;padding:2px 0 6px;font-weight:600;font-size:14px}
fieldset.rv legend+*{clear:both}
.rv-i{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px;cursor:pointer}
.rv-i input{accent-color:var(--accent);width:16px;height:16px}

/* --- вход --- */
.user-chip{display:flex;align-items:center;gap:8px;flex:none;height:38px;padding:0 0 0 4px;border:1px solid transparent;border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.uc-ic{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.uc-ic svg.lucide{width:16px;height:16px}
.uc-name{font-size:14px;font-weight:500;white-space:nowrap;padding-right:4px}
.uc-out{align-self:stretch;width:38px;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.uc-out:hover{color:var(--red);background:var(--red-soft)}
.uc-out svg.lucide{width:16px;height:16px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.login-side{background:var(--side);color:var(--side-ink);padding:36px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-side .brand{padding:0}
.login-brand{display:flex;align-items:center;gap:14px;color:#fff}
.vt-logo{height:24px;width:auto;display:block;flex:none}
.lb-sep{width:1px;height:20px;background:rgba(255,255,255,.28)}
.lb-prod{font:600 14px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}

.login-side::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,var(--side) 0%,color-mix(in srgb,var(--side) 72%,transparent) 38%,color-mix(in srgb,var(--accent) 38%,transparent) 100%),linear-gradient(90deg,color-mix(in srgb,var(--side) 55%,transparent),transparent 70%);mix-blend-mode:normal}
.login-credit{font-size:11.5px;color:var(--side-mute);opacity:.8}
.login-credit a{color:inherit;text-decoration:none}
.login-credit a:hover{color:var(--side-ink)}
.login-side h1{font-size:36px;line-height:1.12;color:#fff;margin:0 0 16px;max-width:14ch}
:root[data-theme="dark"] .login-side h1{color:var(--side-ink)}
.login-side p{color:var(--side-mute);max-width:46ch;margin:0}
.login-main{display:grid;place-items:center;padding:40px 24px}
.login-main:focus{outline:none}
.login-card{width:min(560px,100%)}
.login-card h2{font-size:24px;margin:0 0 6px}
.login-card>p.muted{margin:0 0 20px}
.role-grid{display:grid;grid-template-columns:1fr;gap:10px}
.role-grid .role-card{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;align-items:center;padding:14px 44px 14px 16px}
.role-grid .rc-ic{grid-row:1/3;margin:0}
.role-grid .role-card b{grid-column:2}
.role-grid .role-card .small{grid-column:2}
.role-grid .rc-go{top:50%;margin-top:-9px}
.role-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:inherit;padding:14px 16px;border:1px solid transparent;border-radius:var(--r-m);background:var(--surface);cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.04)}
.role-card{transition:border-color .15s,box-shadow .15s,transform .15s}
.role-card:hover,.role-card:focus-visible{border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 6px 20px rgba(31,79,191,.12);transform:translateY(-1px)}
.role-card:active{transform:none}
.role-card:focus-visible{outline-offset:3px}
.rc-go{position:absolute;top:16px;right:16px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s}
.role-card:hover .rc-go,.role-card:focus-visible .rc-go{opacity:1;transform:none}
.role-card b{font-size:15px}
.rc-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);margin-bottom:4px}
@media (max-width:960px){
  .login{grid-template-columns:1fr}
  .login-side{padding:24px 16px;gap:16px}
  .login-side h1{font-size:24px}
  .vt-logo{height:20px}.lb-prod{font-size:12.5px}
  .login-side>p.small{display:none}
  .role-grid{grid-template-columns:1fr}
  .uc-name{display:none}
  .passport h2{font-size:22px;max-width:none}
  .passport .timeline{overflow-x:auto;scrollbar-width:none}
  .passport .tl{min-width:68px;font-size:11.5px}
  .row>details.demo{flex:1 1 100%}
  .demo .demo-b .btn{white-space:normal;text-align:left}
  .callout.row{flex-direction:column;align-items:flex-start}
  .callout.row .btn{width:100%}
}

/* --- поиск в списках --- */
.dd-search{position:sticky;top:-4px;margin:-4px -4px 4px;padding:8px;background:var(--surface);border-bottom:1px solid var(--line);z-index:1}
.dd-search svg.lucide{position:absolute;left:19px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.dd-search input{width:100%;min-height:36px;padding-left:32px}
.dd-empty{padding:12px;color:var(--muted);font-size:14px}
.dd-opt[hidden]{display:none}

/* --- коды проектов --- */
.codes{display:flex;flex-wrap:wrap;gap:4px}
.code-link{font:500 12.5px/1.6 var(--code);padding:1px 8px;border-radius:var(--r-s);background:var(--surface-2);border:0;color:var(--ink-2);cursor:pointer}
.code-link:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* --- рекомендации теста: сотрудник, запросы, документы --- */
.my-pm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink-2);margin-bottom:14px}
.my-pm>svg.lucide{color:var(--muted)}
.my-pm>span{flex:1}
.rq-row{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.doc-box{background:var(--surface-2);border:0;border-radius:var(--r-m);padding:12px 14px;font-size:14px;line-height:1.45;margin:0}
ol.doc-box.rules{padding-left:32px;display:grid;gap:6px}

/* --- уведомления --- */
.bell-wrap{position:relative;flex:none}
.bell,.gear{width:38px;height:38px;border:1px solid transparent;border-radius:var(--r-m);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;position:relative}
.bell:hover,.gear:hover{border-color:var(--muted)}
.bell[aria-expanded="true"],.gear[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.bell svg.lucide,.gear svg.lucide{width:18px;height:18px}
.bell-n{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:10px;background:var(--red);color:#fff;font:600 11px/1 var(--ui);font-variant-numeric:tabular-nums;display:grid;place-items:center;border:2px solid var(--paper)}
.gear-wrap{position:relative;flex:none}
.gear svg.lucide{transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.gear:hover svg.lucide{transform:rotate(60deg)}
.gear[aria-expanded="true"] svg.lucide{transform:rotate(120deg)}
.gear-pop{position:absolute;right:0;top:calc(100% + 8px);width:320px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 14px 36px rgba(15,27,45,.18);z-index:70;padding:14px;transform-origin:top right}
.gp-label{font-size:12.5px;color:var(--muted);margin:0 2px 8px}
.seg{--i:0;position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:10px;background:var(--surface-2);border:0}
.seg-pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:7px;background:var(--surface);box-shadow:0 1px 2px rgba(15,27,45,.12),0 0 0 1px var(--line-strong);transform:translateX(calc(var(--i)*100%));transition:transform .32s cubic-bezier(.34,1.3,.64,1)}
.seg button{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 8px;border-radius:7px;color:var(--muted);font:500 12.5px/1.2 var(--ui);cursor:pointer;transition:color .2s}
.seg button:hover{color:var(--ink)}
.seg button[aria-checked="true"]{color:var(--accent)}
.seg button svg.lucide{width:18px;height:18px;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.seg button[aria-checked="true"] svg.lucide{transform:rotate(-12deg) scale(1.12)}
.seg button[data-t="light"][aria-checked="true"] svg.lucide{transform:rotate(90deg) scale(1.12)}
@media (prefers-reduced-motion: no-preference){.gear-pop{animation:gpin .22s cubic-bezier(.2,.9,.3,1.2)}@keyframes gpin{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion: reduce){.gear svg.lucide,.seg-pill,.seg button svg.lucide{transition:none}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media (prefers-reduced-motion: no-preference){
  .bell svg.lucide{transform-origin:50% 8%}
  .bell:hover svg.lucide,.bell[aria-expanded="true"] svg.lucide{animation:ring .9s cubic-bezier(.36,.07,.19,.97)}
  @keyframes ring{0%{transform:rotate(0)}12%{transform:rotate(16deg)}26%{transform:rotate(-14deg)}40%{transform:rotate(10deg)}54%{transform:rotate(-7deg)}68%{transform:rotate(4deg)}82%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
  .bell:hover .bell-n{animation:nbump .5s cubic-bezier(.34,1.56,.64,1)}
  @keyframes nbump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
  .notif-pop{animation:gpin .22s cubic-bezier(.2,.9,.3,1.2);transform-origin:top right}
}
@media (max-width:640px){.gear-wrap,.bell-wrap{position:static}.gear-pop,.notif-pop{position:fixed;left:16px;right:16px;top:72px;width:auto;max-width:none}}
.notif-pop{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 14px 36px rgba(15,27,45,.18);z-index:70;overflow:hidden}
.np-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.np-list{max-height:min(420px,70vh);overflow:auto}
.np-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;font:inherit;color:var(--ink-2);cursor:pointer}
.np-item:hover,.np-item:focus-visible{background:var(--surface-2)}
.np-item>svg.lucide{width:16px;height:16px;color:var(--muted);margin-top:3px;flex:none}
.np-item.unread{color:var(--ink);background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.np-item.unread>svg.lucide{color:var(--accent)}
.np-b{display:flex;flex-direction:column;gap:2px;min-width:0}
.np-t{font-size:14px;line-height:1.4}
.np-item.unread .np-t{font-weight:500}
.np-d{font-size:12px;color:var(--muted)}
.np-empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:14px}
/* --- вопрос по заявке --- */
.tk-sync{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 8px 8px 14px;border-radius:var(--r-m);background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.tk-sync>span{display:flex;align-items:center;gap:8px}.tk-sync svg.lucide{width:15px;height:15px;color:var(--muted)}
.tq{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:8px 10px;border-radius:var(--r-s);background:var(--surface-2);border:0;font-size:13px;color:var(--ink-2)}
.tq svg.lucide{width:15px;height:15px;color:var(--muted);flex:none;margin-top:2px}
.trow .ta{gap:6px}
.q-btn{padding:0;width:32px}
/* --- шаблоны: применение к проектам --- */
.tpl-diff{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 20px;background:var(--amber-soft);color:var(--ink-2);font-size:13.5px;border-bottom:1px solid var(--line)}
.tpl-diff>svg.lucide{color:var(--amber);width:16px;height:16px}
.tpl-diff>span{flex:1;min-width:220px}

/* --- раунд 3: исполнитель, меню «Ещё» --- */
.tassign{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--ink-2);font-size:12.5px}
.tassign svg.lucide{width:13px;height:13px;color:var(--muted)}
details.more{display:none;position:relative}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
.more-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 14px 36px rgba(15,27,45,.16);padding:4px;z-index:30}
.more-i{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:9px 10px;border-radius:var(--r-s);font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.more-i:hover{background:var(--surface-2)}
@media (max-width:960px){ .d-only{display:none!important} details.more{display:block} .passport-actions{justify-content:flex-start;margin:-10px 0} .more-pop{left:0;right:auto} }

/* --- версии шаблонов --- */
details.vers{border-top:1px solid var(--line)}
details.vers>summary{padding:12px 20px;font-size:14px}
.vlist{list-style:none;margin:0;padding:6px 20px 14px;display:grid;gap:8px}
.vlist li{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;font-size:14px}
/* --- отчёт по ИИ: одна серия, один оттенок, неброские оси --- */
.hm-wrap{display:flex;align-items:center;gap:20px 40px;flex-wrap:wrap}
.hm-stats{display:grid;grid-template-columns:1fr;gap:14px;margin:0;flex:1;min-width:150px}
.hm-stats dt{font-size:12.5px;color:var(--muted)}
.hm-stats dd{margin:2px 0 0;font:600 22px/1.2 var(--display);font-variant-numeric:tabular-nums}
.hm-stats dd.alert{color:var(--red)}
.hm-stats dd.up{color:var(--ok)}
.hm-stats dd small{font:500 12.5px var(--ui);color:var(--muted);margin-left:6px}
.hm-stats:has(>div:nth-child(4)){grid-template-columns:1fr 1fr;gap:16px 24px}
.hm{display:flex;flex-direction:column;gap:10px;width:max-content;max-width:100%}
.hm-grid{display:grid;grid-template-columns:22px repeat(var(--cols),14px);grid-auto-rows:14px;gap:4px;font-size:11px;color:var(--muted);line-height:14px}
.hm-grid>span{white-space:nowrap;overflow:visible}
.hm-d{font-size:11px}
.hm-c{display:block;width:14px;height:14px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent)}
.hm-c.l1{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.hm-c.l2{background:color-mix(in srgb,var(--accent) 45%,var(--surface))}
.hm-c.l3{background:color-mix(in srgb,var(--accent) 70%,var(--surface))}
.hm-c.l4{background:var(--accent)}
.hm-c.fut{background:none;box-shadow:none}
.hm-grid .hm-c:not(.fut):hover{outline:2px solid var(--ink-2);outline-offset:1px}
.hm-legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);align-self:flex-end}
.hm-legend .hm-c{width:11px;height:11px;border-radius:2px}
.hm-legend .hm-c:first-child{margin-left:4px}.hm-legend .hm-c:last-child{margin-right:4px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-grid-f{fill:var(--line)}
.ch-base{stroke:var(--line-strong);stroke-width:1}
.ch-ax{fill:var(--muted);font:12px var(--ui)}
.ch-val{fill:var(--ink);font:600 12px var(--ui)}
.ch-fill{fill:var(--accent)}
.ch-hit{fill:transparent}
.ch-bar:hover .ch-fill,.ch-bar:focus .ch-fill{fill:var(--accent-2)}
.ch-bar:focus{outline:none}
.ch-bar:focus .ch-hit{stroke:var(--accent);stroke-width:2}
.spark{display:block}
.num{font-variant-numeric:tabular-nums}
.blk{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:600}
.blk svg.lucide{width:14px;height:14px;color:var(--red)}
.hbar{margin-bottom:12px}
.hbar-l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.hbar-t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar-t i{display:block;height:100%;background:var(--ink-2);border-radius:0 4px 4px 0}
.ai-grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:960px){.ai-grid{grid-template-columns:1fr}}

/* --- календарь --- */
.dd-val.ph{color:var(--faint)}
.dp-ic{width:16px;height:16px;color:var(--muted);flex:none}
.dp-btn[aria-expanded="true"] .dp-ic{color:var(--accent)}
.dd-pop.dp-pop{width:300px;padding:12px;max-height:none;overflow:visible}
.dp-h{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.dp-h b{flex:1;font:600 15px/1 var(--ui);padding-left:6px}
.dp-nav{width:34px;height:34px;border:0;background:none;border-radius:6px;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.dp-nav:hover{background:var(--surface-2);color:var(--ink)}
.dp-nav svg{width:18px;height:18px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-wd{font-size:12px;color:var(--muted);text-align:center;padding:6px 0 4px}
.dp-day{height:36px;border:0;background:none;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.dp-day:hover{background:var(--surface-2)}
.dp-day.out{color:var(--faint)}
.dp-day.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent);font-weight:600}
.dp-day.sel{background:var(--accent);color:#fff;font-weight:600;box-shadow:none}
:root[data-theme="dark"] .dp-day.sel{color:#0B1220}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dp-day.sel{color:#0B1220}}
.dp-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dp-f{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.dp-link{border:0;background:none;color:var(--accent);font-weight:500;cursor:pointer;padding:6px 10px;border-radius:6px}
.dp-link:hover{background:var(--accent-soft)}

/* --- переключатель темы --- */
/* низ сайдбара: тема + сброс, в сетке меню */
aside .side-foot{margin-top:auto;padding:14px 0 0;border-top:1px solid var(--side-on);display:grid;gap:8px;font-size:14px}
aside .side-reset{color:var(--side-mute);margin-top:2px}
aside .side-reset:hover{color:var(--side-ink)}

/* --- хлебные крошки --- */
.crumb{border:0;background:none;padding:0;font:inherit;color:var(--muted);cursor:pointer}
.crumb:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.crumb-sep{color:var(--line-strong);margin:0 10px;font-weight:400}

/* --- раскрывающиеся блоки --- */
details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:14px 20px;font-weight:600}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.fold[open]>summary:after{transform:rotate(-135deg)}
details.fold>summary svg.lucide{color:var(--accent)}
details.fold[open]>summary{border-bottom:1px solid var(--line)}
.demo{border:1px dashed var(--line-strong);border-radius:var(--r-m);background:transparent}
.demo>summary{padding:10px 14px;font-weight:500;color:var(--muted);font-size:14px}
.demo .demo-b{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
aside .demo{border-color:var(--side-on);margin-top:10px}
aside .demo>summary{color:var(--side-mute)}
aside .demo>summary:after{border-color:var(--side-mute)}
aside .demo .demo-b{color:var(--side-mute);flex-direction:column;align-items:flex-start}

/* --- сервис-деск: группы и строки --- */
.tgroup+.tgroup{border-top:1px solid var(--line)}
.tgroup:first-child>.tg-h{border-radius:calc(var(--r-m) - 1px) calc(var(--r-m) - 1px) 0 0}
.tgroup:last-child>.trow:last-child{border-bottom-left-radius:calc(var(--r-m) - 1px);border-bottom-right-radius:calc(var(--r-m) - 1px)}
.tg-h{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface-2)}
.tg-h .who{min-width:0}.tg-h .who b{display:block;font-size:14.5px}.tg-h .who span{font-size:13px;color:var(--muted)}
.tg-h .cnt-open{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
.trow{display:grid;grid-template-columns:72px minmax(0,1fr) 190px 140px 210px;gap:14px;align-items:center;padding:10px 18px;border-top:1px solid var(--line)}
.trow .tid{font-family:var(--code);font-size:13px;color:var(--muted);white-space:nowrap}
.trow .tt{min-width:0}
.trow .tg{font-size:13px;color:var(--muted)}
.trow .ta{display:flex;justify-content:flex-end;white-space:nowrap}
.trow .sla{white-space:nowrap}
.trow.done .tt{color:var(--muted)}
.dproj-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.dproj-h h3{margin:0;font:600 16px/1.3 var(--ui)}
.dproj-h .progress{width:140px}

/* --- модальное окно --- */
.modal.wide{width:min(660px,100%)}
.mt-desc{margin:0;padding:12px 20px 0}
.mt-draft{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;justify-content:space-between;padding:10px 20px;background:var(--accent-soft);font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.mt-draft .row{gap:6px}
.mt-foot{padding:10px 20px 14px;border-top:1px solid var(--line)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ghost.danger{color:var(--red)}.btn.ghost.danger:hover:not(:disabled){background:var(--red-soft)}
.mgroup{border:0;margin-left:0;margin-right:0;margin-bottom:0;padding:0;min-width:0}
.mform>*+*{margin-top:18px}
.mform>.mgroup{padding-top:18px;border-top:1px solid var(--line)}
.modal.wide h2{padding-bottom:14px;border-bottom:1px solid var(--line)}
.modal.wide .m-b{padding-top:18px}
.mgroup legend{font-size:13.5px;font-weight:600;color:var(--ink);padding:0;margin-bottom:10px;display:flex;align-items:center;gap:2px;float:left;width:100%}
.mgroup legend+*{clear:both}
.mgroup:disabled{opacity:.45}
.mopts{display:grid;gap:6px}.mopts.c2{grid-template-columns:1fr 1fr}.mopts.c3{grid-template-columns:repeat(3,1fr)}
.mopt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid transparent;cursor:pointer;font-size:13.5px;transition:border-color .12s,background .12s}
.mopt:hover{border-color:var(--line-strong)}
.mopt:has(input:checked){background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.mopt input{margin:2px 0 0;accent-color:var(--accent);width:15px;height:15px;flex:none}
.mopt b{display:block;font-weight:600;color:var(--ink)}
.mopt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.mgroup:disabled .mopt{cursor:not-allowed}
.mopt:has(input:disabled){opacity:.5;cursor:not-allowed}.mgroup:disabled .mopt:has(input:disabled){opacity:1}
@media (max-width:640px){.mopts.c2,.mopts.c3{grid-template-columns:1fr}}
.modal-bg{position:fixed;inset:0;background:rgba(15,27,45,.42);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-l);width:min(480px,100%);box-shadow:0 24px 64px rgba(15,27,45,.3)}
.modal h2{font-size:18px;margin:0;padding:20px 22px 6px}
.modal .m-b{padding:6px 22px 18px;color:var(--ink-2)}
.modal .m-b p{margin:0 0 12px}
.modal .m-b ul.plain{margin:0 0 12px}
.modal .m-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-reduced-motion: no-preference){.modal{animation:mIn .16s ease-out}@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}}

.apr-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.apr-t{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.apr-t h3{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apr-a{display:flex;gap:4px;flex:none}
.apr-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:16px 20px}
.apr-facts dt{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.apr-facts dd{margin:0;font-size:14.5px;color:var(--ink);font-weight:500}
.apr-facts dd small{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.apr-team{display:flex;align-items:center;gap:10px}

<div id="app"></div>
<script>
/* ========= Справочники ========= */
const TOOL_CATS = {comm:'Коммуникации', dev:'Разработка', ide:'IDE', pm:'Управление', design:'Дизайн', data:'Данные', ai:'ИИ', sec:'Безопасность'};
const GROUPS = {
  helpdesk:'Служба поддержки (рабочие места)',
  comms:'Администраторы VK Teams',
  devops:'DevOps / репозитории',
  ai:'Команда ИИ-платформы',
  sec:'Информационная безопасность'
};
// Модели работы с заказчиком — шаблоны правил проекта. Хранятся в данных, редактирует руководитель ЦК
const DEFAULT_MODELS=[
  {id:'bank', name:'Банк / финсектор', desc:'Финансовые организации с требованиями регулятора.', comms:'required', formats:['bot','channel'], llms:['onprem','none'], isolation:'strict', dlp:true},
  {id:'corp', name:'Корпоративный заказчик', desc:'Коммерческие проекты с каналом для заказчика.', comms:'allowed', formats:['channel','bot','email'], llms:['gigachat','yagpt','onprem','none'], isolation:'standard', dlp:false},
  {id:'gov', name:'Госзаказчик', desc:'Закрытый контур, заказчик только через официальные каналы.', comms:'forbidden', formats:[], llms:['onprem','none'], isolation:'strict', dlp:true},
  {id:'internal', name:'Внутренний проект', desc:'Проекты для своей компании, без внешнего заказчика.', comms:'forbidden', formats:[], llms:['gigachat','yagpt','onprem','none'], isolation:'standard', dlp:false}
];
const LLM_PREF=['gigachat','yagpt','onprem','none'];
const COMMS_RULE={required:'Обязательно', allowed:'По выбору', forbidden:'Нет'};
function modelNorm(m){m.formats=(m.formats||[]).filter(f=>COMM_FORMATS[f]); m.llms=LLM_PREF.filter(k=>(m.llms||[]).includes(k)); m.clientInComms=m.comms!=='forbidden'; m.llm=m.llms.includes(m.defLlm)?m.defLlm:(m.llms[0]||'none'); m.defLlm=m.llm; return m}
const llmShort=k=>LLMS[k].split(' (')[0];
function modelDiff(a,b){const o=[], add=(x,y)=>x.filter(k=>!y.includes(k));
  if(a.name!==b.name) o.push(`название: «${b.name}»`);
  if(a.comms!==b.comms) o.push(`заказчик в коммуникациях: ${COMMS_RULE[b.comms].toLowerCase()}`);
  add(b.formats,a.formats).forEach(k=>o.push(`разрешён формат «${COMM_FORMATS[k]}»`)); add(a.formats,b.formats).forEach(k=>o.push(`запрещён формат «${COMM_FORMATS[k]}»`));
  add(b.llms,a.llms).forEach(k=>o.push(`разрешён ${llmShort(k)}`)); add(a.llms,b.llms).forEach(k=>o.push(`запрещён ${llmShort(k)}`));
  if(a.llm!==b.llm) o.push(`ИИ по умолчанию: ${llmShort(b.llm)}`);
  if(a.isolation!==b.isolation) o.push(`изоляция: ${ISOLATION[b.isolation].split(' — ')[0].toLowerCase()}`);
  if(a.dlp!==b.dlp) o.push(b.dlp?'DLP обязателен':'DLP не требуется');
  return o}
const defaultModels=()=>DEFAULT_MODELS.map(m=>modelNorm({...JSON.parse(JSON.stringify(m)), v:1, versions:[{v:1,d:'2026-02-10',by:'Руководитель ЦК',ch:'Первая версия'}]}));
// доступ как к словарю: CLIENT_MODELS[id], Object.entries(CLIENT_MODELS)
const CLIENT_MODELS=new Proxy({},{
  get:(_,k)=>typeof k==='string'?((S&&S.models)||[]).find(m=>m.id===k)||((S&&S.models)||[])[0]:undefined,
  ownKeys:()=>((S&&S.models)||[]).map(m=>m.id),
  getOwnPropertyDescriptor:()=>({enumerable:true,configurable:true})});
const modelUse=id=>S.projects.filter(p=>p.model===id&&p.status!=='closed').length;
function modelRules(m){
  const cloud=m.llms.filter(k=>k!=='none'), llmV=!cloud.length?'ИИ запрещён':cloud.length===1?LLMS[cloud[0]].split(' (')[0]:`${cloud.length} на выбор`;
  return [
    ['users','Заказчик в коммуникациях', m.comms==='forbidden'?'Только внутренняя команда':m.formats.map(f=>COMM_FORMATS[f]).join(' · '), COMMS_RULE[m.comms], m.comms==='required'],
    ['sparkles','Языковые модели', (cloud.map(k=>LLMS[k]).join(' · ')||'Ассистенты отключены')+(cloud.length>1?` · по умолчанию ${llmShort(m.llm)}`:'')+(cloud.length&&m.llms.includes('none')?' · можно отключить':''), llmV, cloud.length>0],
    ['lock','Изоляция контекста', ISOLATION[m.isolation].split(' — ')[1].replace(/^./,c=>c.toUpperCase()), ISOLATION[m.isolation].split(' — ')[0], m.isolation==='strict'],
    ['shield-check','DLP', 'Контроль утечек данных', m.dlp?'Обязателен':'Не требуется', m.dlp]];
}
function modelViolations(p,m=CLIENT_MODELS[p.model]){const v=[];
  if(!m.llms.includes(p.ai.llm)) v.push(`Модель «${m.name}» не разрешает «${LLMS[p.ai.llm].split(' (')[0]}»`);
  if(m.isolation==='strict'&&p.ai.isolation!=='strict') v.push(`Модель «${m.name}» требует строгой изоляции`);
  if(m.comms==='forbidden'&&p.clientInComms) v.push(`Модель «${m.name}» не допускает заказчика в коммуникациях`);
  if(m.comms==='required'&&!p.clientInComms) v.push(`Модель «${m.name}» требует канал с заказчиком`);
  if(p.clientInComms&&m.formats.length&&!m.formats.includes(p.commFormat)) v.push(`Формат связи «${COMM_FORMATS[p.commFormat]}» не разрешён моделью`);
  if(m.dlp&&!['draft','pending','returned'].includes(p.status)&&!hasDlp(p)) v.push(`Модель «${m.name}» требует DLP`);
  return v}
const modelLive=['provisioning','ready','active'];
const hasDlp=p=>S.tickets.some(t=>t.pid===p.id&&t.kind==='sec'&&/DLP/.test(t.title));
const modelRefs=id=>S.projects.filter(p=>p.model===id);
function modelFixPlan(p,m=CLIENT_MODELS[p.model]){const tag=aiTag(p), o=[];
  if(!m.llms.includes(p.ai.llm)) o.push({t:m.llm==='none'?'Отозвать ключ ИИ проекта: ИИ запрещён моделью':`ИИ-шлюз: перевести ключ проекта «${tag}» с ${llmShort(p.ai.llm)} на ${LLMS[m.llm]}`, g:'ai', k:'ai', f:x=>{x.ai.llm=m.llm}});
  if(m.isolation==='strict'&&p.ai.isolation!=='strict') o.push({t:`Включить строгую изоляцию: отдельный индекс rag/${tag}, ключ и квота проекта`, g:'ai', k:'ai', f:x=>{x.ai.isolation='strict'}});
  if(m.comms==='forbidden'&&p.clientInComms) o.push({t:`Отключить представителей заказчика и архивировать канал #${p.code.toLowerCase()}-client`, g:'comms', k:'client', f:x=>{x.clientInComms=false; x.ai.sources=x.ai.sources.filter(s=>s!=='client'); x.channels=x.channels.filter(c=>c.type!=='client')}});
  else if(m.comms==='required'&&!p.clientInComms) o.push({t:`Создать канал с заказчиком #${p.code.toLowerCase()}-client (${COMM_FORMATS[m.formats[0]]})`, g:'comms', k:'channel', f:x=>{x.clientInComms=true; x.commFormat=m.formats[0]; x.channels.push({name:x.code.toLowerCase()+'-client',type:'client'})}});
  else if(p.clientInComms&&m.formats.length&&!m.formats.includes(p.commFormat)) o.push({t:`Перевести связь с заказчиком на формат «${COMM_FORMATS[m.formats[0]]}»`, g:'comms', k:'client', f:x=>{x.commFormat=m.formats[0]}});
  if(m.dlp&&!hasDlp(p)) o.push({t:`Согласовать DLP-политику проекта ${p.code}`, g:'sec', k:'sec', f:()=>{}});
  return o}
const LLMS = {onprem:'On-prem LLM (Qwen, закрытый контур)', gigachat:'GigaChat (облако РФ)', yagpt:'YandexGPT (облако РФ)', none:'ИИ-ассистенты запрещены'};
const ISOLATION = {strict:'Строгая — отдельный RAG-индекс, ключ и квота на проект, логирование всех запросов', standard:'Стандартная — общий ключ отдела, запросы маркируются тегом проекта'};
const COMM_FORMATS = {channel:'Общий канал в VK Teams', bot:'Канал + чат-бот выгрузки в контекст проекта', email:'Только почта / встречи (без мессенджера)'};
const STATUS = {
  draft:{t:'Черновик', c:'b-grey'}, pending:{t:'На утверждении', c:'b-warn'}, returned:{t:'Возвращён на доработку', c:'b-bad'},
  provisioning:{t:'Настройка доступов', c:'b-info'}, ready:{t:'Готов к старту', c:'b-ready'}, active:{t:'Активен', c:'b-ok'},

  </tr>`;

function startHint(p,short){
  if(!p.start||['active','closing','closed'].includes(p.status)) return null;
  const d=Math.round((parseD(p.start)-parseD(today()))/864e5), dd=n=>`${n} ${plural(n,'день','дня','дней')}`;
  if(short){
    if(p.status==='ready') return d<=0?{t:'Пора запускать',c:'late'}:{t:'Можно запускать',c:'ok'};
    if(d<0) return {t:`Опоздание ${dd(-d)}`,c:'late'};
    if(d===0) return {t:'Сегодня',c:'late'};
    return d<=14?{t:`Через ${dd(d)}`,c:''}:null;
  }
  if(p.status==='ready') return d<=0?{t:`Старт был ${fmtD(p.start)} — запустите проект`,c:'late'}:{t:`Можно запускать, старт через ${dd(d)}`,c:'ok'};
  if(d<0) return {t:`Старт прошёл ${dd(-d)} назад`,c:'late'};
  if(d===0) return {t:'Старт сегодня',c:'late'};
  return d<=14?{t:`Старт через ${dd(d)}`,c:''}:null;
}
function projFiltered(){
  let l=visibleProjects(); const q=(ui.pq||'').trim().toLowerCase();
  if(q) l=l.filter(p=>(p.name+' '+p.code+' '+p.client).toLowerCase().includes(q));
  if(ui.pst&&ui.pst!=='all') l=l.filter(p=>p.status===ui.pst);
  const so=ui.psort||'start', ord=Object.keys(STATUS);
  l.sort((a,b)=>(a.status==='closed')-(b.status==='closed')||(so==='name'?a.name.localeCompare(b.name,'ru'):so==='status'?ord.indexOf(a.status)-ord.indexOf(b.status):(a.start||'').localeCompare(b.start||'')));
  return l;
}

function attention(){
  const out=[], add=(ic_,t,id,late,tab)=>out.push({ic:ic_,t,id,late,tab});
  visibleProjects().forEach(p=>{
    if(['provisioning','ready','active'].includes(p.status)&&(ui.role==='ck'||ui.role==='pm')){const v=modelViolations(p); if(v.length) add('scale',`«${p.name}» расходится с правилами модели: ${v[0].replace(/^./,c=>c.toLowerCase())}`,p.id,true)}
    if(ui.role==='pm'){
      if(p.status==='returned') add('undo-2',`«${p.name}» вернули на доработку`,p.id,true);
      (p.requests||[]).filter(q=>q.status==='pending').forEach(q=>add('key-round',`«${p.name}»: ${E(q.emp).name} просит доступ к «${T(q.tool).name}»`,p.id,false,'team'));
      projTickets(p.id).filter(t=>t.status==='question').forEach(t=>add('message-circle-question',`«${p.name}»: поддержка ждёт ответа по заявке ${t.id}`,p.id,true,'tickets'));
      if(p.status==='ready') add('rocket',`«${p.name}»: рабочие места готовы — запустите проект`,p.id,daysTo(p.start)<=0);
    }
    if(['active','ready'].includes(p.status)){
      const rd=daysTo(reviewDue(p)); if(rd<=14) add('shield-check',rd<0?`«${p.name}»: пересмотр доступов просрочен на ${dWord(-rd)}`:`«${p.name}»: пересмотр доступов до ${fmtD(reviewDue(p))}`,p.id,rd<=3);
      const ed=daysTo(p.end); if(ed<0) add('archive',`«${p.name}»: срок истёк ${fmtD(p.end)}, доступы не отозваны — завершите проект`,p.id,true);
      else if(ed<=30) add('calendar-clock',`«${p.name}» завершается ${fmtD(p.end)} — запланируйте закрытие`,p.id,false);
    }
    if(p.status==='closing') add('archive',`«${p.name}»: идёт отзыв доступов`,p.id,false);
  });
  return out.sort((a,b)=>b.late-a.late);
}

function wErrs(step,d){
  const e={};
  if(step===0){
    if(!d.name.trim()) e.name='Укажите название проекта';
    if(!d.code) e.code='Укажите код проекта';
    else if(!/^[A-Z0-9]{3,8}$/.test(d.code)) e.code='Код — от 3 до 8 латинских букв или цифр';
    else if(S.projects.some(p=>p.code===d.code&&p.id!==ui.wiz?.editId)) e.code=`Код ${d.code} уже занят другим проектом`;
    if(!d.start) e.start='Выберите дату старта';
    else if(d.start<today()&&!ui.wiz?.editId) e.start='Дата старта не может быть в прошлом';
    if(!d.end) e.end='Укажите дату окончания — до неё будут действовать доступы';
    else if(d.start&&d.end<=d.start) e.end='Окончание должно быть позже старта';
  }
  if(step===1&&d.clientInComms&&!d.clientReps.length) e.reps='Добавьте хотя бы одного представителя заказчика';
  if(step===3){const v=modelViolations({...d,status:'draft'}); if(v.length) e.model=v[0]}
  if(step===2&&!d.team.length) e.team='Добавьте в команду хотя бы одного сотрудника';
  return e;
}

function deskList(){
  let list=S.tickets.slice();
  if(ui.tf==='open') list=list.filter(t=>t.status!=='done'); else if(ui.tf==='late') list=list.filter(t=>slaInfo(t)?.c==='late'); else if(ui.tf==='mine') list=list.filter(t=>t.assignee===meAgent()&&t.status!=='done'); else if(ui.tf!=='all') list=list.filter(t=>t.group===ui.tf&&t.status!=='done');
  // ближе к нарушению SLA — выше
  const left=t=>t.status==='done'||!t.at?Infinity:t.at+SLA_H[t.group]*36e5-Date.now();
  list.sort((a,b)=>left(a)-left(b));
  const q=(ui.dq||'').trim().toLowerCase();
  if(q) list=list.filter(t=>[t.id,t.title,t.tool?T(t.tool).name:'',t.emp?E(t.emp).name:'',P(t.pid)?.code||''].join(' ').toLowerCase().includes(q));

  return ticketGroups(list).map(({p,groups})=>{const pr=progress(p.id);return `<div class="card">
    <div class="dproj-h"><h3>${esc(p.name)}</h3><span class="mono faint">${esc(p.code)}</span>${badge(STATUS[p.status])}<div style="flex:1"></div>

const AI_RATE={onprem:0.35,gigachat:1.2,yagpt:1.0}; // ₽ за 1000 токенов (оценка)
const WEEKS=8;
function aiUsage(p){
  const users=p.team.filter(m=>m.tools.some(t=>['llm','aide'].includes(t)));
  const res={users:users.length, weeks:Array(WEEKS).fill(0), blocked:{pd:0,sec:0,db:0}, tokens:0, cost:0};
  if(p.ai.llm==='none'||!users.length||!['active','ready','closing','closed','provisioning'].includes(p.status)) return res;
  let x=[...p.code].reduce((a,c)=>a*31+c.charCodeAt(0),7)%2147483647; const rnd=()=>(x=(x*48271)%2147483647)/2147483647;
  const now=parseD(today());
  for(let i=0;i<WEEKS;i++){
    const wk=new Date(now); wk.setDate(now.getDate()-7*(WEEKS-1-i)); const iso=isoD(wk);
    const live=iso>=p.start&&iso<=p.end&&(p.status==='active'||p.status==='closing'||(p.status==='closed'&&iso<=p.end));
    res.weeks[i]=live?Math.round(users.length*(35+rnd()*55)*(0.7+i*0.05)):0;
  }
  const last4=res.weeks.slice(-4).reduce((a,b)=>a+b,0);
  if(last4){ res.blocked.pd=Math.floor(rnd()*4)+(p.clientInComms?1:0); res.blocked.sec=Math.floor(rnd()*3); res.blocked.db=p.model==='bank'?1:Math.floor(rnd()*2) }
  res.tokens=last4*(1400+Math.round(rnd()*900)); res.cost=Math.round(res.tokens/1000*(AI_RATE[p.ai.llm]||1));
  return res;
}

// Тепловая карта по дням в стиле графика активности: недели — столбцы, дни недели — строки
function heatMap(weeks,{label='запросов',seed=1}={}){
  const DW=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'], WT=[1.15,1.25,1.2,1.1,.95,.16,.08], now=parseD(today());
  const h=k=>{let x=Math.sin(k*12.9898+seed*78.233)*43758.5453; return x-Math.floor(x)};
  const cols=weeks.map((tot,i)=>{
    const mon=parseD(today()); mon.setDate(mon.getDate()-7*(weeks.length-1-i)-((mon.getDay()+6)%7));
    const days=DW.map((_,d)=>{const dt=new Date(mon); dt.setDate(mon.getDate()+d); return dt});
    const w=days.map((dt,d)=>dt>now?0:WT[d]*(.7+h(i*7+d)*.6)), sw=w.reduce((a,b)=>a+b,0)||1;
    const v=w.map(x=>Math.floor(tot*x/sw)); let r=tot-v.reduce((a,b)=>a+b,0);
    w.map((x,d)=>[x,d]).sort((a,b)=>b[0]-a[0]).forEach(([x,d])=>{if(r>0&&x>0){v[d]++;r--}});
    return days.map((dt,d)=>({dt,v:v[d],fut:dt>now}));
  });
  const max=Math.max(1,...cols.flat().map(c=>c.v)), lvl=v=>v?Math.min(4,1+Math.floor(v/max*3.999)):0;
  const head=cols.map((c,i)=>`<span>${i%2===0?`${pad2(c[0].dt.getDate())}.${pad2(c[0].dt.getMonth()+1)}`:''}</span>`).join('');
  const body=DW.map((dn,d)=>`<span class="hm-d">${d%2===0&&d<5?dn:''}</span>${cols.map(c=>{const x=c[d]; return x.fut?'<i class="hm-c fut"></i>':`<i class="hm-c l${lvl(x.v)}" title="${dn} ${pad2(x.dt.getDate())}.${pad2(x.dt.getMonth()+1)}: ${nf(x.v)} ${label}"></i>`}).join('')}`).join('');
  const total=weeks.reduce((a,b)=>a+b,0);
  return `<div class="hm" role="img" aria-label="Запросы к ИИ по дням за ${weeks.length} недель, всего ${nf(total)}">
    <div class="hm-grid" style="--cols:${cols.length}"><span></span>${head}${body}</div>
    <div class="hm-legend">Меньше${[0,1,2,3,4].map(l=>`<i class="hm-c l${l}"></i>`).join('')}Больше</div></div>`;
}

function modal({title, body, ok='Готово', danger=false, onOk, wide=false, info=false}){
  const prev=document.activeElement;
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-labelledby="mTitle"><h2 id="mTitle">${esc(title)}</h2><div class="m-b">${body}</div><div class="m-f">${info?'':'<button class="btn" data-m="cancel">Отмена</button>'}<button class="btn ${danger?'red':'pri'}" data-m="ok">${esc(ok)}</button></div></div>`;
  document.body.appendChild(bg); enhanceSelects(bg); enhanceDates(bg);
  const close=()=>{ddClose(); bg.remove(); document.removeEventListener('keydown',key,true); prev?.focus?.()};
  const confirm=()=>{if(onOk&&onOk()===false) return; close()};
  const key=e=>{
    if(dd||dp||e.target.closest?.('.dd-btn')) return;
    if(e.key==='Escape'){e.preventDefault(); close()}
    else if(e.key==='Enter'&&(e.metaKey||e.ctrlKey||e.target.tagName!=='TEXTAREA')){e.preventDefault(); confirm()}
    else if(e.key==='Tab'){const f=[...bg.querySelectorAll('button,textarea,input')]; const i=f.indexOf(document.activeElement); if(e.shiftKey&&i<=0){e.preventDefault(); f[f.length-1].focus()} else if(!e.shiftKey&&i===f.length-1){e.preventDefault(); f[0].focus()}}
  };
  document.addEventListener('keydown',key,true);
  bg.addEventListener('mousedown',e=>{if(e.target===bg) close()});
  const cb=bg.querySelector('[data-m=cancel]'); if(cb) cb.onclick=close;
  bg.querySelector('[data-m=ok]').onclick=confirm;
  icons();
  (bg.querySelector('textarea,input')||bg.querySelector('[data-m=ok]')).focus();
}

/* главные цифры: счёт от нуля при входе на экран, от прежнего значения при изменении */
let statMem={key:'',vals:[]}, statRaf=0;
function countUp(){
  if(typeof requestAnimationFrame!=='function'||typeof matchMedia!=='function') return;
  const els=[...document.querySelectorAll('.statline .v')], key=ui.role+'|'+ui.view+'|'+(ui.pid||'');
  const parsed=els.map(el=>{const m=el.textContent.match(/^(\D*?)(\d[\d\s\u00a0\u202f]*\d|\d)(.*)$/s); return m&&{el,pre:m[1],num:+m[2].replace(/\D/g,''),sep:/\D/.test(m[2]),post:m[3]}});
  const prev=statMem.key===key?statMem.vals:[];
  statMem={key,vals:parsed.map(p=>p?p.num:null)};
  cancelAnimationFrame(statRaf);
  if(!els.length||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const jobs=parsed.map((p,i)=>p&&{...p,from:prev[i]??0,delay:prev.length?0:i*90}).filter(j=>j&&j.from!==j.num);
  if(!jobs.length) return;
  const fmt=(j,n)=>j.pre+(j.sep||j.num>=10000?nf(n):String(n))+j.post, dur=prev.length?600:1000, t0=performance.now();
  jobs.forEach(j=>j.el.textContent=fmt(j,j.from));
  const step=t=>{let live=false;
    jobs.forEach(j=>{const k=Math.min(1,Math.max(0,(t-t0-j.delay)/dur)), e=1-Math.pow(1-k,4); j.el.textContent=fmt(j,Math.round(j.from+(j.num-j.from)*e)); if(k<1) live=true});
    if(live) statRaf=requestAnimationFrame(step)};
  statRaf=requestAnimationFrame(step);
}
