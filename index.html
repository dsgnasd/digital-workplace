  close:el=>{const p=P(el.dataset.id); const n=p.team.reduce((a,m)=>a+m.tools.length,0);
    modal({title:`Завершить «${p.name}»?`, body:`<p>Служба поддержки получит заявки на отзыв <b>${n} ${plural(n,'доступа','доступов','доступов')}</b> у ${p.team.length} ${plural(p.team.length,'сотрудника','сотрудников','сотрудников')}. Каналы, ключ ИИ и репозитории переведут в архив. Проект закроется, когда все заявки будут выполнены.</p><p class="small muted">Отменить завершение нельзя.</p>`, ok:'Завершить проект', danger:true,
      onOk:()=>{p.status='closing'; const k=genRevoke(S,p,p.team,'full').length; notify('support',`Заявки на отзыв доступов по «${p.name}»: ${k}`,p.id,{ic:'archive',tab:'tickets'}); p.history.push({d:today(),t:`Проект завершается. Заявок на отзыв доступов: ${k}`}); save(); render(); toast(`Создано ${k} ${plural(k,'заявка','заявки','заявок')} на отзыв доступов`)}})},
  madd:el=>{const p=P(el.dataset.id); const avail=S.emps.filter(e=>!p.team.some(m=>m.emp===e.id));
    if(!avail.length){toast('Все сотрудники уже в команде'); return}
    modal({title:'Добавить сотрудника в команду', body:`<div class="stack"><div class="field"><label for="mEmp">Сотрудник</label><select id="mEmp">${empOptions(avail)}</select></div>
      <div class="field"><label for="mRole">Роль на проекте</label><select id="mRole"><option value="">Роль по профилю</option>${S.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><span class="hint">Доступы выдадут по шаблону роли. Опциональные инструменты можно добавить позже.</span></div></div>`, ok:'Добавить и создать заявки',
      onOk:()=>{const emp=$('#mEmp').value, role=$('#mRole').value||E(emp).role; const m={emp, role, tools:[...R(role).req]}; p.team.push(m); (p.tplVer??={})[role]??=R(role).v||1; const k=genGrant(S,p,m).length; p.history.push({d:today(),t:`В команду добавлен ${E(emp).name} (${R(role).name}). Заявок: ${k}`}); save(); render(); notify('emp',`Вас добавили в проект «${p.name}»`,p.id,{user:emp,ic:'user-plus'}); notify('support',`Новые заявки по «${p.name}»: ${k} (новый участник)`,p.id,{ic:'ticket',tab:'tickets'}); toast(`${E(emp).name} добавлен, создано ${k} ${plural(k,'заявка','заявки','заявок')}`)}})},
  mrem:el=>{const p=P(el.dataset.id), m=p.team.find(x=>x.emp===el.dataset.emp);
    modal({title:`Убрать ${E(m.emp).name} с проекта?`, body:`<p>Будут созданы заявки на отзыв ${m.tools.length} ${plural(m.tools.length,'доступа','доступов','доступов')} и исключение из каналов проекта.</p>`, ok:'Убрать и отозвать доступы', danger:true,
      onOk:()=>{p.team=p.team.filter(x=>x!==m); const k=genRevoke(S,p,[m],'member').length; p.history.push({d:today(),t:`${E(m.emp).name} убран с проекта. Заявок на отзыв: ${k}`}); save(); render(); toast(`Создано ${k} ${plural(k,'заявка','заявки','заявок')} на отзыв доступов`)}})},
  review:el=>{const p=P(el.dataset.id);
    modal({title:`Пересмотр доступов «${p.name}»`, body:`<p class="small">Снимите отметку с доступов, которые сотруднику больше не нужны. Для них создадутся заявки на отзыв.</p>
      ${p.team.map(m=>`<fieldset class="rv"><legend>${esc(E(m.emp).name)} <span class="muted small">${esc(R(m.role).name)}</span></legend>${m.tools.map(t=>`<label class="rv-i"><input type="checkbox" checked data-emp="${m.emp}" data-tool="${t}">${esc(T(t).name)}${R(m.role).req.includes(t)?' <span class="faint small">обязательный для роли</span>':''}</label>`).join('')}</fieldset>`).join('')}`, ok:'Подтвердить пересмотр',
      onOk:()=>{const off=[...document.querySelectorAll('.rv-i input:not(:checked)')].map(i=>({emp:i.dataset.emp,tool:i.dataset.tool})); const total=p.team.reduce((a,m)=>a+m.tools.length,0);
        const byEmp={}; off.forEach(o=>(byEmp[o.emp]??=[]).push(o.tool));
        Object.entries(byEmp).forEach(([emp,tools])=>{const m=p.team.find(x=>x.emp===emp); m.tools=m.tools.filter(t=>!tools.includes(t)); genRevoke(S,p,[{emp,tools}],'tools')});
        p.lastReview=today(); (p.reviews??=[]).push({d:today(),by:ROLES_UI[ui.role].t,kept:total-off.length,revoked:off.length});
        p.history.push({d:today(),t:`Пересмотр доступов (${ROLES_UI[ui.role].t}): подтверждено ${total-off.length}, отозвано ${off.length}`}); save(); render();
        toast(off.length?`Пересмотр сохранён, на отзыв ушло ${off.length} ${plural(off.length,'заявка','заявки','заявок')}`:'Пересмотр сохранён, все доступы подтверждены')}})},
  skip:()=>{const m=$('#main'); m?.focus(); m?.scrollIntoView()},
  pclear:()=>{ui.pq=''; ui.pst='all'; render(); $('#pq')?.focus()},
  wreset:()=>modal({title:'Начать заново?', body:'<p>Все поля мастера очистятся. Уже сохранённые черновики проектов не пострадают.</p>', ok:'Очистить мастер', danger:true, onOk:()=>{ui.wiz=newWiz(); render(); $('#f-name')?.focus()}}),
  rtool:el=>{const r=R(el.dataset.r), t=el.dataset.t, was=r.req.includes(t)?'req':r.opt.includes(t)?'opt':'off'; if(r.req.includes(t)){r.req=r.req.filter(x=>x!==t)} else if(r.opt.includes(t)){r.opt=r.opt.filter(x=>x!==t); r.req.push(t)} else r.opt.push(t);
    const st=x=>x==='req'?'обязательный':x==='opt'?'опциональный':'не используется';
    tplVersion(r,`«${T(t).name}»: ${st(was)} → ${st(r.req.includes(t)?'req':r.opt.includes(t)?'opt':'off')}`,'tool:'+t);
    save(); render(); toast(`${r.name}: «${T(t).name}» — ${r.req.includes(t)?'обязательный':r.opt.includes(t)?'опциональный':'не используется'}`)},
  // мастер
  wstep:el=>{const i=+el.dataset.i; for(let k=0;k<i;k++) if(wErr(k,ui.wiz.d)) {ui.wiz.step=k; ui.wiz.tried=k; render(); focusFirstErr(); return} ui.wiz.step=i; ui.wiz.tried=-1; render()},
  wnext:()=>{const w=ui.wiz; if(wErr(w.step,w.d)){w.tried=w.step; render(); focusFirstErr(); return} w.tried=-1; w.step++; window.scrollTo(0,0); render(); $('.steps .step.on')?.focus()},
  wprev:()=>{ui.wiz.step--; ui.wiz.tried=-1; render()},
  wmodel:el=>{applyModel(ui.wiz.d, el.dataset.k); render()},
  waddrep:()=>{const v=$('#repIn').value.trim(), c=$('#repContact').value.trim(), er=$('#e-repadd');
    const bad=!v?'Укажите ФИО и роль представителя':!c?'Укажите почту или ник в VK Teams — без контакта поддержка не сможет подключить представителя':!/^[^@\s]+@[^@\s]+\.[^@\s]+$|^@[\w.-]{2,}$/.test(c)?'Контакт: адрес почты (name@company.ru) или ник VK Teams (@name)':'';
    if(bad){ if(er) er.textContent=bad; ($(!v?'#repIn':'#repContact'))?.focus(); return }
    ui.wiz.d.clientReps.push(`${v} · ${c}`); render(); $('#repIn')?.focus()},
  wrmrep:el=>{ui.wiz.d.clientReps.splice(+el.dataset.i,1); render()},
  waddm:()=>{const emp=$('#empSel').value; const role=$('#roleSel').value||E(emp).role; ui.wiz.d.team.push({emp, role, tools:[...R(role).req]}); render()},
  wrmm:el=>{ui.wiz.d.team.splice(+el.dataset.i,1); render()},
  wtool:el=>{const m=ui.wiz.d.team[+el.dataset.i], t=el.dataset.t; m.tools=m.tools.includes(t)?m.tools.filter(x=>x!==t):[...m.tools,t]; render()},
  wsave:()=>{if(!ui.wiz.d.name.trim()||!ui.wiz.d.code){toast('Укажите название и код');return} const p=wizToProject(); save(); toast('Черновик сохранён'); render()},
  wsubmit:()=>{const w=ui.wiz; if(wErrAll(w.d)){w.tried=w.step; const f=$('#wfoot'); if(f){f.outerHTML=wFooter(); icons()} return} const p=wizToProject(); p.status='pending'; p.comment=''; p.history.push({d:today(),t:'Отправлен на утверждение'}); save(); ui.wiz=null; ui.pid=p.id; ui.tab='passport'; notify('ck',`Новый проект на утверждение: «${p.name}»`,p.id,{ic:'stamp'}); toast('Отправлено руководителю ЦК на утверждение'); go('project')}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  if(el.tagName==='A') e.preventDefault();
  const keep=Object.entries(el.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,c=>'-'+c.toLowerCase())}="${CSS.escape(v)}"]`).join('');
  const was=ui.view+'|'+ui.pid;
  A[el.dataset.act]?.(el);
  // сменился экран или проект — показываем страницу с самого верха
  const moved=was!==ui.view+'|'+ui.pid; if(moved) window.scrollTo(0,0);
  // после перерисовки возвращаем фокус на тот же элемент — важно для клавиатуры (без прокрутки)
  if(!document.body.contains(el)&&(!document.activeElement||document.activeElement===document.body)){
    const id=el.dataset.id; const t=id&&S.tickets.find(x=>x.id===id);
    // точный элемент → тот же объект с другим действием → следующая открытая заявка в списке
    (document.querySelector(keep)||(id&&document.querySelector(`[data-id="${CSS.escape(id)}"]:is(button,a)`))||(t&&document.querySelector('.trow [data-act="tk"]'))||$('#main'))?.focus({preventScroll:true});
    if(moved) window.scrollTo(0,0);
  }
});
document.addEventListener('keydown',e=>{
  const rc=e.target.closest?.('.role-card'); if(!rc) return;
  const dir={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!dir) return;
  e.preventDefault(); const cs=[...document.querySelectorAll('.role-card')]; cs[(cs.indexOf(rc)+dir+cs.length)%cs.length].focus();
});
document.addEventListener('keydown',e=>{
  const mc=e.target.closest?.('.model-card'); if(!mc) return;
  const dir={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key]; if(!dir) return;
  e.preventDefault(); const ks=Object.keys(CLIENT_MODELS); const n=ks[(ks.indexOf(mc.dataset.k)+dir+ks.length)%ks.length];
  applyModel(ui.wiz.d,n); render(); document.querySelector(`.model-card[data-k="${n}"]`)?.focus();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['repIn','repContact'].includes(e.target.id)){e.preventDefault();A.waddrep()}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.field==='role'){ui.role=el.value; try{localStorage.setItem(KEY+'-role',ui.role)}catch(_){} go(NAV[ui.role][0][0]); return}
  if(el.dataset.field==='me'){ui.me=el.value; render(); return}
  if(el.dataset.field==='lemp'){ui.loginEmp=el.value; render(); document.querySelector('#lEmp')?.parentNode.querySelector('.dd-btn')?.focus(); return}
  if(el.dataset.field==='tf'){ui.tf=el.value; render(); return}
  if(el.dataset.field==='pst'){ui.pst=el.value; render(); return}
  if(el.dataset.field==='psort'){ui.psort=el.value; render(); return}
  if(el.dataset.field==='ap'){ui.ap=el.value; ui.alimit=100; render(); return}
  if(el.dataset.field==='atype'){ui.atype=el.value; ui.alimit=100; render(); return}
  if(el.dataset.field==='erole'){ui.erole=el.value; ui.elimit=50; render(); return}
  if(el.dataset.field==='eload'){ui.eload=el.value; ui.elimit=50; render(); return}
  if(el.dataset.rm){const r=R(el.dataset.rm); r.method=el.value; tplVersion(r,'Изменена методология','method'); save(); render(); toast(`Методология сохранена, версия v${r.v}`); return}
  if(el.dataset.src){const d=ui.wiz.d,k=el.dataset.src; d.ai.sources=el.checked?[...d.ai.sources,k]:d.ai.sources.filter(x=>x!==k); render(); return}
  if(el.dataset.w){
    if(['text','date'].includes(el.type)) return wInput(el); // текст уже учтён — без перерисовки, чтобы не терять клик
    setW(el); render();
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.classList?.contains('dd-q')){ if(dd) ddFilter(el.value); return }
  if(el.id==='aq'){ui.aq=el.value; ui.alimit=100; const t=$('#alist'); if(t){t.innerHTML=auditList(); icons()} return}
  if(el.id==='eq'){ui.eq=el.value; ui.elimit=50; const t=$('#elist'); if(t){t.innerHTML=peopleList(); icons()} return}
  if(el.id==='pq'){ui.pq=el.value; const t=$('#ptable'); if(t){t.innerHTML=projTable(projFiltered()); icons()} return}
  if(el.id==='dq'){ui.dq=el.value; const t=$('#dlist'); if(t){t.innerHTML=deskList(); icons()} return}
  if(!e.isComposing) wInput(el);
});
document.addEventListener('compositionend',e=>wInput(e.target));
function wInput(el){
  if(!ui.wiz||!el.dataset||!el.dataset.w||!['text','date'].includes(el.type)) return;
  setW(el);
  // код проекта нормализуем прямо в поле, без перерисовки страницы
  if(el.dataset.w==='code'&&el.value!==ui.wiz.d.code){const pos=Math.min(el.selectionStart,ui.wiz.d.code.length); el.value=ui.wiz.d.code; try{el.setSelectionRange(pos,pos)}catch(_){}}
  wSyncErr(); saveWiz();
  const f=$('#wfoot'); if(f){f.outerHTML=wFooter(); icons();}
}
function setW(el){
  const d=ui.wiz.d, k=el.dataset.w; let v=el.type==='checkbox'?el.checked:el.value;
  if(k==='code') v=translit(v).replace(/[^A-Z0-9]/g,'').slice(0,8);
  if(k.startsWith('ai.')) d.ai[k.slice(3)]=v; else d[k]=v;
  if(k==='clientInComms'&&v&&!d.ai.sources.includes('client')) d.ai.sources.push('client');
  if(k==='ai.llm'&&v==='none'&&d.commFormat==='bot') d.commFormat='channel';
}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.tools) S=seed();
if(!S.models) S.models=defaultModels(); S.models.forEach(modelNorm);
S.projects.forEach(p=>{if(!['draft','pending','returned'].includes(p.status)) p.modelV??=1});
// миграция демо-данных v2: архив и параллельные проекты добавляются к сохранённым данным, правки пользователя не трогаем
if((S.demoV||1)<2){const cur=S, fresh=seed(); S=cur;
  fresh.projects.filter(p=>p.id.startsWith('x')&&!S.projects.some(q=>q.id===p.id||q.code===p.code)).forEach(p=>{
    S.projects.push(p); fresh.tickets.filter(t=>t.pid===p.id).forEach(t=>S.tickets.push({...t,id:'SD-'+(++S.seq)}))});
  S.demoV=2; try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// миграция старых данных: единый термин «ИИ»
S.tools.forEach(t=>t.name=t.name.replace(/^AI-/,'ИИ-')); S.roles.forEach(r=>r.method=r.method.replace(/AI-/g,'ИИ-'));
S.roles.forEach(r=>{r.versions??=[{v:1,d:'2026-02-10',by:'Руководитель ЦК',ch:'Первая версия шаблона'}]; r.v??=r.versions.length});
S.notifs??=[]; S.projects.forEach(p=>{ p.requests??=[]; if(!p.end){const d=parseD(p.start)||new Date(); d.setMonth(d.getMonth()+6); p.end=isoD(d)} p.acks??={}; p.reviews??=[]; if(p.lastReview===undefined) p.lastReview=null; });
S.tickets.forEach(t=>{t.op??='grant'; t.at??=Date.now()});
try{const w=JSON.parse(localStorage.getItem(KEY+'-wiz')); if(w&&w.d){w.d.end??=''; ui.wiz=w}}catch(e){}
try{ui.session=JSON.parse(localStorage.getItem(KEY+'-session'))}catch(e){}
if(ui.session&&!ROLES_UI[ui.session.role]){ui.session=null; try{localStorage.removeItem(KEY+'-session')}catch(e){}}
if(ui.session){ui.role=ui.session.role; if(ui.role==='emp') ui.me=ui.session.user}
ui.lastRole=ui.session?.role||(()=>{try{return localStorage.getItem(KEY+'-role')}catch(e){}})()||'';
if(ui.session&&!applyRoute()&&!NAV[ui.role].some(([x])=>x===ui.view)) ui.view=NAV[ui.role][0][0];
render(false);
if(ui.session) try{history.replaceState(null,'',routeOf())}catch(e){}
</script>
</body>
